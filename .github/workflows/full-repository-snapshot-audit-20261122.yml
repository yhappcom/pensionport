name: Full tracked repository read-only audit snapshot
on:
  push:
    branches:
      - audit/full-repository-snapshot-20261122
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - name: Capture complete tracked tree with content hashes
        run: |
          python - <<'PY'
          import pathlib, subprocess, json, hashlib, zipfile, os
          paths=[os.fsdecode(x) for x in subprocess.check_output(['git','ls-files','-z']).split(b'\0') if x]
          root=pathlib.Path('.')
          files=[]
          with zipfile.ZipFile('/tmp/pensionport-full-tracked-audit.zip','w',zipfile.ZIP_DEFLATED,compresslevel=6) as dest:
              for name in sorted(paths):
                  fp=root/name
                  if not fp.is_file():
                      continue
                  data=fp.read_bytes()
                  files.append({'path':name,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()})
                  dest.writestr(name, data)
              manifest={'schema':'IRE_FULL_TRACKED_AUDIT_20261122','commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
                        'file_count':len(files),'total_bytes':sum(x['bytes'] for x in files),'files':files}
              dest.writestr('_audit_complete_tracked_manifest.json',json.dumps(manifest,ensure_ascii=False,sort_keys=True,indent=2))
          print('COMPLETE_TRACKED_SNAPSHOT',manifest['commit'],manifest['file_count'],manifest['total_bytes'])
          PY
      - name: Export complete tracked repository only, no local secrets
        uses: actions/upload-artifact@v4
        with:
          name: pensionport-full-tracked-audit-20261122
          path: /tmp/pensionport-full-tracked-audit.zip
          if-no-files-found: error
          retention-days: 1
