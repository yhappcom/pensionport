name: V178 source-only cold-start chat packet to frozen V176 (synthetic tests)
on:
  push:
    branches:
      - verify/ire-v6-v178-source-only-coldstart-20261119
  pull_request:
    branches:
      - verify/ire-v6-v177-private-two-turn-checkpoint-20261119
  workflow_dispatch:
permissions:
  contents: read
jobs:
  coldstart-native-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - name: Install frozen native validation dependencies
        run: python -m pip install --disable-pip-version-check -r ire/requirements-evidence-ci.txt 'cryptography==46.0.4'
      - name: V178 strict source-only native import plus prior V176/V177 regressions
        working-directory: validation/ire-v6-frozen
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m compileall -q v176_chat_engine_loop.py v176_chat_engine_cli.py v177_private_turn_checkpoint.py v178_coldstart_chat_packet_bridge.py
          python -m unittest -v test_v178_coldstart_chat_packet_bridge
          python -m unittest -v test_v177_private_turn_checkpoint
          python -m unittest -v test_v176_chat_engine_loop