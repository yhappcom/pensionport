name: V6 public offline intake bundle (NO PRIVATE INPUT)
on:
  push:
    branches:
      - verify/ire-v6-p1-atomic-host-batch-20261109
    paths:
      - '.github/workflows/ire-v6-public-offline-intake.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-only-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate exact public files only, no source archives
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            data/claims.jsonl \
            ire/v5/advisory_knowledge/p4_integrated_scoped_education22_20261106.json \
            ire/v5/advisory_knowledge/p4_p3_incremental_education29_20261106.json \
            validation/ire-v6-frozen/v123_chat_final_gate.py \
            validation/ire-v6-frozen/v123_chat_validated_knowledge_preview.py \
            validation/ire-v6-frozen/test_v123_chat_final_gate.py; do
            test -f "$f"
          done
          test -d ire/v6
          echo "Bundle excludes owner-private SRT/ZIP, owner-inventory, model verdict and DB."
      - name: Pack public V6 code and immutable public prior-knowledge inputs
        shell: bash
        run: |
          set -euo pipefail
          tar --sort=name --mtime='UTC 2026-11-15' --owner=0 --group=0 --numeric-owner -czf v6-public-offline-inputs.tar.gz \
            ire/__init__.py ire/v6 \
            data/claims.jsonl \
            ire/v5/advisory_knowledge/p4_integrated_scoped_education22_20261106.json \
            ire/v5/advisory_knowledge/p4_p3_incremental_education29_20261106.json \
            validation/ire-v6-frozen/v123_chat_final_gate.py \
            validation/ire-v6-frozen/v123_chat_validated_knowledge_preview.py \
            validation/ire-v6-frozen/test_v123_chat_final_gate.py
          sha256sum v6-public-offline-inputs.tar.gz > v6-public-offline-inputs.tar.gz.sha256
          printf '%s\n' "$GITHUB_SHA" > SOURCE_COMMIT_SHA.txt
      - uses: actions/upload-artifact@v4
        with:
          name: v6-public-offline-code-and-prior-only
          path: |
            v6-public-offline-inputs.tar.gz
            v6-public-offline-inputs.tar.gz.sha256
            SOURCE_COMMIT_SHA.txt
          if-no-files-found: error
          retention-days: 7
