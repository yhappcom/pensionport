name: V170 in-chat decision boundary and evidence-triggered OPEN revisit (synthetic)
on:
  push:
    branches:
      - verify/ire-v6-v170-chat-boundary-revisit-20261119
  pull_request:
    branches:
      - verify/ire-v6-v169-chat-resumable-20261118
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review-contract-and-frozen-native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - name: Install frozen native verification requirements
        run: python -m pip install --disable-pip-version-check -r ire/requirements-evidence-ci.txt 'cryptography==46.0.4'
      - name: V170 challenge-response source pin, stale head, reopen and native HOLD controls
        working-directory: validation/ire-v6-frozen
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m compileall -q v170_in_chat_review_bridge.py v170_evidence_revisit.py
          python -m unittest -v test_v170_in_chat_review_bridge test_v170_evidence_revisit test_v170_native_in_chat_interop
          python -m unittest -v test_v167_chat_research_loop test_v168_chat_native_replay test_v169_chat_research_journal test_v169_native_interop
          python -m unittest -v test_v166_e4_full_video_readiness