name: Independent Research Engine - clean-room foundation

on:
  push:
    branches:
      - feat/ire-cleanroom-engine-20261101
      - feat/ire-live-evidence-verification-20261101
      - feat/ire-chat-assisted-noapi-20261101
      - feat/ire-incremental-advisory-20261101
      - feat/ire-v2-advisory-system-redesign-20261101
      - feat/ire-v3-chat-orchestration-20261102
    paths:
      - "ire/**"
      - ".github/workflows/ire-cleanroom-gate.yml"
  pull_request:
    paths:
      - "ire/**"
      - ".github/workflows/ire-cleanroom-gate.yml"

permissions:
  contents: read

jobs:
  independent-source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pinned PDF primary-evidence parser and synthetic fixture tools
        run: |
          python -m pip install --disable-pip-version-check -r ire/requirements-evidence-ci.txt
      - name: Compile new engine without importing older research modules
        run: |
          python -m compileall -q ire
      - name: Run fresh synthetic adversarial research suite
        run: |
          python -m unittest discover -s ire/tests -v
      - name: Enforce prior-research non-citation, no historical import and no protected changes
        run: |
          python - <<'PY'
          import ast, json, pathlib, subprocess
          root=pathlib.Path(".")
          base="d613fd201f4bb077f1ccc74d28dee937b11bfcb2"
          cp=subprocess.run(["git","diff","--name-only",base,"HEAD"],
                            capture_output=True,text=True,check=True)
          files=[f for f in cp.stdout.splitlines() if f]
          assert files, "EMPTY_INDEPENDENT_ENGINE_DIFF"
          assert all(f.startswith("ire/") or
                     f==".github/workflows/ire-cleanroom-gate.yml"
                     for f in files), "HISTORICAL_OR_OTHER_FILE_MODIFIED"
          forbidden={"scripts","v30","v5","data","synthesis"}
          modules=list(pathlib.Path("ire").rglob("*.py"))
          assert len(modules)>=6
          for file in modules:
              program=ast.parse(file.read_text(encoding="utf-8"))
              for node in ast.walk(program):
                  if isinstance(node,ast.Import):
                      assert all(alias.name.split(".")[0] not in forbidden
                                 for alias in node.names),str(file)
                  elif isinstance(node,ast.ImportFrom):
                      assert (node.module or "").split(".")[0] not in forbidden,str(file)
          contract=json.loads((root/"ire/contracts/research_engine_v1.json").read_text())
          assert contract["schema"]=="IRE_CLEANROOM_ENGINE_CONTRACT_V1"
          assert contract["policy"]["prior_claims_may_be_copied_or_quoted"] is False
          assert contract["policy"]["prior_engine_code_may_be_imported"] is False
          assert contract["policy"]["prior_gold_labels_may_be_fitted"] is False
          assert contract["current"]["operational_status"]=="BLOCKED"
          assert contract["current"]["gold_labeled_real_claims"]==0
          assert contract["current"]["auto_knowledge_merges"]==0
          if pathlib.Path("ire/contracts/research_system_v2.json").exists():
              v2=json.loads(pathlib.Path("ire/contracts/research_system_v2.json").read_text())
              assert v2["schema"]=="IRE_INTEGRATED_ADVISORY_RESEARCH_V2"
              assert v2["selected_model_execution"]=="CURRENT_CHATGPT_CONVERSATION"
              assert v2["additional_model_api_calls"] is False
              assert v2["history_policy"]["preserve_main"] is True
              assert v2["history_policy"]["do_not_import_old_claims_or_conclusions_as_facts"] is True
              assert len(v2["workflow"])==8
              assert v2["current"]["production_approved"] is False
              assert contract.get("legacy_disposition",{}).get("current_default") is False
              v3=json.loads(pathlib.Path("ire/contracts/research_system_v3_completion.json").read_text())
              assert v3["schema"]=="IRE_V3_P0_P2_ENGINE_CONTRACT_20261102"
              assert v3["host"]=="CURRENT_CHATGPT_CONVERSATION"
              assert v3["external_llm_model_api_calls"]==0
              assert len(v3["pipeline"])==8
              assert v3["release_when_unproved"]=="BLOCKED"
              assert "ACTUAL_INDEPENDENT_HUMAN_BLIND_GOLD_VERIFICATION" in v3["not_yet_implemented_or_proved"]
              print("PASS: V2 single-request ChatGPT-mode cumulative advisory contract, no model API")
          one_turn=json.loads((root/"ire/contracts/research_one_turn_v3.json").read_text())
          assert one_turn["schema"]=="IRE_V3_NOAPI_ONE_TURN_EXECUTION_CONTRACT_V1"
          assert one_turn["host"]=="CURRENT_CHATGPT_CONVERSATION"
          assert one_turn["external_llm_api_calls"]==0
          assert one_turn["source_first_cited_answers_required"] is True
          assert one_turn["full_bundle_preflight_before_any_new_checkpoint"] is True
          assert one_turn["gaps_may_be_silently_skipped"] is False
          assert one_turn["accepted_answers_may_be_overwritten"] is False
          assert one_turn["unbounded_338_windows_guaranteed_in_single_turn"] is False
          assert one_turn["auto_promotion_to_verified_financial_facts"] is False
          assert one_turn["auto_release_personalized_investment_advice"] is False
          print("PASS: no-API one-turn deterministic source-linked execution contract")
          print("PASS: standalone import boundary, unchanged prior research, release BLOCKED")
          PY
      - name: No original subtitles or private originals tracked in clean-room source
        shell: bash
        run: |
          if git ls-files ire | grep -Ei '\.(srt|zip|pdf|xlsx|xls|csv|db|sqlite|pem|p12|env)$'; then
            echo 'ERROR: private or raw research artifact committed'; exit 1
          fi
          echo 'PASS: only public engine sources and synthetic tests'

      - name: Live official financial institution HTML fetch smoke
        if: github.ref_name == 'feat/ire-live-evidence-verification-20261101'
        run: |
          python - <<'PY'
          from ire.evidence import independently_fetch_candidate
          page=independently_fetch_candidate("https://www.bis.org/about")
          assert page["schema"]=="IRE_INDEPENDENT_DOCUMENT_V1"
          assert page["issuer_domain_category"]=="BIS"
          assert len(page["visible_text"])>100
          assert "central banks" in page["visible_text"].lower()
          assert "monetary and financial stability" in page["visible_text"].lower()
          assert len(page["raw_sha256"])==64
          assert page["source_read_mode"]=="LIVE_NETWORK_FETCH"
          assert page["independent_financial_fact_approved"] is False
          print("LIVE_OFFICIAL_HTML_FETCH_PASS")
          print("publisher_candidate=BIS raw_bytes="+str(page["raw_byte_size"]))
          print("document_sha256="+page["raw_sha256"])
          PY
      - name: Preserve tested public IRE implementation for private original-source replays
        uses: actions/upload-artifact@v4
        with:
          name: ire-tested-sources
          path: |
            ire/**/*.py
            ire/*.py
            ire/README.md
            ire/*.md
            ire/requirements-evidence-ci.txt
            ire/contracts/*.json
          if-no-files-found: error
          retention-days: 7
