name: E1 V230-V231 V228 source-native turn2 custody
on:
  push:
    branches:
      - verify/ire-v6-e1-v230-v228-source-native-handoff-20261121
  pull_request:
    branches:
      - verify/ire-v6-e2-source-census-adversarial-20261120
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ire-v230-e1-source-native
  cancel-in-progress: true
jobs:
  e1-real-owner-source-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - name: Install pinned deterministic IRE dependencies
        run: |
          python -m pip install --disable-pip-version-check -r ire/requirements-evidence-ci.txt 'cryptography==46.0.4'
      - name: Protect original E1 engines and all source bytes
        run: |
          python - <<'PY'
          import pathlib,subprocess
          base="c9d2a676d3e3002ea2132ce690ee8d75c7a65286"
          changed=subprocess.check_output(["git","diff","--name-only",base,"HEAD"],text=True).splitlines()
          allowed_prefix="validation/ire-v6-frozen/"
          allowed_workflow=".github/workflows/ire-v230-e1-source-native-handoff.yml"
          assert changed, "E1_V230_NO_CHANGE"
          assert all((p.startswith(allowed_prefix) and
                      pathlib.Path(p).suffix in {".py",".json",".md"}) or
                     p==allowed_workflow for p in changed), "PROTECTED_E1_CODE_CHANGED"
          assert all(pathlib.Path(p).suffix.lower() not in
                     {".srt",".zip",".sqlite",".db",".env",".csv",".xlsx",".pem"}
                     for p in changed), "PRIVATE_BYTES_TRACKED"
          print("E1_V230_FROZEN_ENGINE_PROTECTION_PASS",len(changed))
          PY
      - name: V230 genuinely separate V228 input and 2-turn receipt (synthetic)
        working-directory: validation/ire-v6-frozen
        env:
          PYTHONPATH: ../..
        run: |
          python -m compileall -q v230_e1_v228_source_native_handoff.py test_v230_e1_v228_source_native_handoff.py
          python -m unittest -v test_v230_e1_v228_source_native_handoff
      - name: V231 private source-first second-turn attestation (synthetic tests only)
        working-directory: validation/ire-v6-frozen
        env:
          PYTHONPATH: ../..
        run: |
          python -m compileall -q v231_e1_v228_private_turn2_custody_bridge.py test_v231_e1_v228_private_turn2_custody_bridge.py
          python -m unittest -v test_v231_e1_v228_private_turn2_custody_bridge
      - name: Existing source freeze, E1 V229 fail-closed and V203 E1 structural regressions
        working-directory: validation/ire-v6-frozen
        env:
          PYTHONPATH: ../..
        run: |
          python -m unittest -v test_v228_v193_actual_two_turn_runtime_gate test_v229_e1_v228_operational_handoff_preflight test_v203_e1_v176_origin_native_host_bridge test_v204_e1_independent_realistic_input_red test_v205_e1_runtime_preflight

      - name: V232 end-to-end real V6 SQLite host-only writing (synthetic source)
        working-directory: validation/ire-v6-frozen
        env:
          PYTHONPATH: ../..
        run: |
          python -m compileall -q test_v232_e1_real_source_v6_host_only.py
          python -m unittest -v test_v232_e1_real_source_v6_host_only
      - name: V233 genuine source-native V6 host to V127 parent checkpoint (synthetic tests)
        working-directory: validation/ire-v6-frozen
        env:
          PYTHONPATH: ../..
        run: |
          python -m compileall -q v233_e1_v228_actual_parent_checkpoint_preflight.py test_v233_e1_v228_actual_parent_checkpoint_preflight.py
          python -m unittest -v test_v233_e1_v228_actual_parent_checkpoint_preflight
      - name: V234 cross-child source/context/qualifier/number custody (synthetic)
        working-directory: validation/ire-v6-frozen
        env:
          PYTHONPATH: ../..
        run: |
          python -m compileall -q v234_e1_cross_child_context_custody.py test_v234_e1_cross_child_context_custody.py
          python -m unittest -v test_v234_e1_cross_child_context_custody
      - name: V235 exact V127 to V123/V128/V126 source-native release gateway (synthetic)
        working-directory: validation/ire-v6-frozen
        env:
          PYTHONPATH: ../..
        run: |
          python -m compileall -q v235_e1_real_parent_release_gateway.py test_v235_e1_real_parent_release_gateway.py
          python -m unittest -v test_v235_e1_real_parent_release_gateway
      - name: V237 all parent atoms to source-backed child ChatGPT review tasks
        working-directory: validation/ire-v6-frozen
        env:
          PYTHONPATH: ../..
        run: |
          python -m compileall -q v237_e1_parent_child_review_contract.py test_v237_e1_parent_child_review_contract.py
          python -m unittest -v test_v237_e1_parent_child_review_contract
      - name: V238 native partial child source draft and 21 pending cross-claim escrow
        working-directory: validation/ire-v6-frozen
        env:
          PYTHONPATH: ../..
        run: |
          python -m compileall -q v238_e1_child_native_scope_draft.py test_v238_e1_child_native_scope_draft.py
          python -m unittest -v test_v238_e1_child_native_scope_draft
      - name: Bundle public engine code for isolated offline real-source verification
        run: |
          mkdir -p /tmp/e1-v6-public-code/validation /tmp/e1-v6-public-code/data
          cp -a ire /tmp/e1-v6-public-code/
          cp data/claims.jsonl /tmp/e1-v6-public-code/data/
          cp -a validation/ire-v6-frozen /tmp/e1-v6-public-code/validation/
          cd /tmp/e1-v6-public-code
          python -c "from pathlib import Path; blocked=[str(p) for p in Path('.').rglob('*') if p.is_file() and p.suffix.lower() in {'.srt','.zip','.db','.sqlite'}]; assert not blocked, blocked"
          zip -q -r /tmp/e1-v6-public-code.zip ire validation data
      - name: Publish isolated public engine package (NO owner data)
        uses: actions/upload-artifact@v4
        with:
          name: v231-offline-v6-public-code
          path: /tmp/e1-v6-public-code.zip
          if-no-files-found: error
          retention-days: 1
