name: Subtitle evidence review gate

on:
  push:
    branches:
      - feat/subtitles-incremental-registry-20261009
    paths:
      - "data/subtitles/**"
      - "data/analysis_events/**"
      - "scripts/audit_subtitle_review_gate.py"
      - "scripts/preflight_subtitle_batch.py"
      - "scripts/ingest_subtitle_zip.py"
      - "scripts/recover_subtitle_sources.py"
      - "scripts/reproduce_all_weather_1972_2022.py"
      - ".gitignore"
      - ".github/workflows/subtitle-review-gate.yml"
      - "WORKFLOW.md"
      - "docs/INVESTMENT_RESEARCH_VERIFICATION_POLICY_20261012.md"
      - "docs/VIDEO_REVIEW_RECORD_TEMPLATE.md"
      - "docs/SUBTITLE_VERIFICATION_QUEUE_20261010.md"
      - "data/synthesis/investment_knowledge_v4/**"
      - "scripts/verify_v4_quant_models.py"
      - "scripts/verify_v4_closure_addendum.py"
      - "scripts/verify_v4_cross_layer_audit.py"
      - "scripts/verify_v4_006_010_models.py"
      - "docs/V4_QUANTITATIVE_CI_GATE_20261030.md"
      - "knowledge/**"
      - "synthesis/**"
  pull_request:
    paths:
      - "data/subtitles/**"
      - "data/analysis_events/**"
      - "scripts/audit_subtitle_review_gate.py"
      - "scripts/preflight_subtitle_batch.py"
      - "scripts/ingest_subtitle_zip.py"
      - "scripts/recover_subtitle_sources.py"
      - "scripts/reproduce_all_weather_1972_2022.py"
      - ".gitignore"
      - ".github/workflows/subtitle-review-gate.yml"
      - "WORKFLOW.md"
      - "docs/INVESTMENT_RESEARCH_VERIFICATION_POLICY_20261012.md"
      - "docs/VIDEO_REVIEW_RECORD_TEMPLATE.md"
      - "docs/SUBTITLE_VERIFICATION_QUEUE_20261010.md"
      - "data/synthesis/investment_knowledge_v4/**"
      - "scripts/verify_v4_quant_models.py"
      - "scripts/verify_v4_closure_addendum.py"
      - "scripts/verify_v4_cross_layer_audit.py"
      - "scripts/verify_v4_006_010_models.py"
      - "docs/V4_QUANTITATIVE_CI_GATE_20261030.md"
      - "knowledge/**"
      - "synthesis/**"

permissions:
  contents: read

# Stop duplicate in-flight runs only within the same event and branch/PR.
# Keep push and pull_request separate so a required PR check is not cancelled by push.
# This does NOT conceal completed failures or weaken any evidence validation.
concurrency:
  group: subtitle-evidence-${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Audit evidence/provenance without approval inflation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compile and test read-only audit tool
        run: |
          python -m py_compile scripts/audit_subtitle_review_gate.py scripts/preflight_subtitle_batch.py
          python scripts/audit_subtitle_review_gate.py --self-test
          python -B scripts/preflight_subtitle_batch.py --self-test
          python -m py_compile scripts/ingest_subtitle_zip.py scripts/recover_subtitle_sources.py
          python scripts/recover_subtitle_sources.py --self-test
          python -m py_compile scripts/reproduce_all_weather_1972_2022.py
          python scripts/reproduce_all_weather_1972_2022.py --self-test
          if python scripts/reproduce_all_weather_1972_2022.py >/tmp/all-weather-source-gate.json; then
            echo "ERROR: backtest unexpectedly ran without source data"; exit 1
          fi
          python -c 'import json; d=json.load(open("/tmp/all-weather-source-gate.json")); assert d["status"]=="BLOCKED_MISSING_SOURCE_RETURNS"'
      - name: Enforce V4 quantitative model arithmetic and source integrity
        run: |
          python -B scripts/verify_v4_quant_models.py --self-test
          python -B scripts/verify_v4_quant_models.py --root .
      - name: Verify V4 studies 001-005 bounded closure models and manifest
        run: |
          python -B scripts/verify_v4_closure_addendum.py --self-test
          python -B scripts/verify_v4_closure_addendum.py --root .
      - name: Verify V4 cross-layer source conventions and bond-risk scope
        run: |
          python -B scripts/verify_v4_cross_layer_audit.py --self-test
          python -B scripts/verify_v4_cross_layer_audit.py --root .
      - name: Validate V4 videos 006-010 numerical research and provenance
        run: |
          python -B scripts/verify_v4_006_010_models.py --self-test
          python -B scripts/verify_v4_006_010_models.py --root .
      - name: Validate 70-source extension records and selective verification policy
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('.')
          m=json.loads((root/'data/subtitles/research_expansion_progress_20261012.json').read_text())
          v=json.loads((root/'data/subtitles/optional_verification_register_20261012.json').read_text())
          assert m['roster_count']==791 and m['source_srt_registered_unique_count']==70
          ids=m['all_45_educational_review_ids']
          assert len(ids)==m['verified_v3_educational_analysis_count']==len(set(ids))
          assert len(m['new_in_this_extension'])==3 and len(m['new_in_next_five'])==5 and len(m['new_in_third_five'])==5 and len(m['new_in_fourth_five'])==5 and len(m['new_in_fifth_five'])==5 and len(m['new_in_ten_20261013'])==10
          assert m['srt_source_not_yet_deep_reviewed_count']==70-len(ids)
          assert m['existing_pilot_drafts_pending_full_claim_evidence_count']==0
          for e in m['new_in_this_extension']+m['new_in_next_five']+m['new_in_third_five']+m['new_in_fourth_five']+m['new_in_fifth_five']+m['new_in_ten_20261013']:
              x=e['video_id']
              p=json.loads((root/'data/subtitles/pilots'/f'{x}.json').read_text())
              a=json.loads((root/'data/analysis_events'/f'{x}.json').read_text())
              assert p['stage']=='EVIDENCE_REVIEW_DRAFT' and p['approval']=='NOT_APPROVED'
              assert a['analysis_status']=='COMPLETE' and a['approval']=='APPROVED'
              assert a['video_id']==p['video_id']==x
              assert len(a['core_claims'])==len(p['claims'])
              assert {c['claim_id'] for c in a['core_claims']}=={c['claim_id'] for c in p['claims']}
              assert p['source_audit'].get('audio_checked',p['source_audit'].get('actual_audio_checked')) is False and p['source_audit']['frames_checked'] is False
          assert len({i['item_id'] for i in v['items']})==len(v['items'])
          assert all(i['video_id'] in m['all_45_educational_review_ids'] for i in v['items'])
          for name in ['docs/INVESTMENT_RESEARCH_VERIFICATION_POLICY_20261012.md','docs/VIDEO_REVIEW_RECORD_TEMPLATE.md','knowledge/ETF_BASIC_VERIFIED_PRINCIPLES_20261012.md']:
              assert (root/name).is_file(),name
          print('EXTENSION_POLICY_PASS',len(ids),'audited analyses,',len(v['items']),'optional followups')
          PY
      - name: Assert dated 24-item evidence-gate review
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          register = json.loads(Path('data/subtitles/optional_verification_register_20261012.json').read_text())
          items = register['items']
          assert len(items) == len({x['item_id'] for x in items})
          assert all(x['status'] in ('OPEN', 'RESOLVED') for x in items)
          summary = register['reassessment_20261013_pass2_summary']
          audited = [x for x in items if 'triage_20261013_pass2' in x]
          assert summary['open_items_reviewed'] == len(audited) == 24
          assert sum(x['importance'] == 'HIGH' for x in audited) == summary['high'] == 9
          assert sum(x['importance'] == 'MEDIUM' for x in audited) == summary['medium'] == 9
          assert sum(x['importance'] == 'LOW' for x in audited) == summary['low'] == 6
          for item in audited:
              gate = item['triage_20261013_pass2']
              assert gate['evidence_gate'] and gate['independent_finding']
              assert gate['minimum_missing_proof'] and gate['decision_use_restriction']
              assert gate['original_audio_checked'] is False
              assert gate['original_frames_checked'] is False
              assert gate['outcome'] == 'OPEN_RETAINED_NO_UNSUPPORTED_RESOLUTION'
          report = Path(register['reassessment_20261013_pass2_report'])
          assert report.is_file()
          assert report.read_text().count(' | HIGH |') + report.read_text().count(' | MEDIUM |') + report.read_text().count(' | LOW |') == 24
          print('OPEN_24_EVIDENCE_GATE_PASS', len(audited), 'audited issues')
          PY
      - name: Recalculate draft statistics and blockers
        run: |
          python scripts/audit_subtitle_review_gate.py --root . --full-queue > "${RUNNER_TEMP}/subtitle-review-audit.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          x = json.loads((Path(os.environ["RUNNER_TEMP"]) / "subtitle-review-audit.json").read_text())
          s = x["summary"]
          assert s["roster_count"] == 791, s
          assert not s["errors"], s["errors"]
          assert all(item["status"] == "BLOCKED_REVIEW_DRAFT" or item["status"] == "PROMOTION_ELIGIBLE" for item in x["priority_review_queue"])
          print("Draft videos:", s["draft_video_count"])
          print("Draft claims:", s["draft_claim_count"])
          print("Promotion eligible:", s["pilot_promotion_eligible"])
          print("Historical manually maintained progress is stale:", s["historical_snapshot_is_stale"])
          PY
      - name: Reject promotion of new incomplete canonical analyses
        shell: bash
        run: |
          git diff --name-only --diff-filter=A origin/main...HEAD -- 'data/analysis_events/*.json' > "${RUNNER_TEMP}/new-canonical.txt"
          while IFS= read -r candidate; do
            [ -z "$candidate" ] && continue
            python scripts/audit_subtitle_review_gate.py --root . --check-candidate "$candidate" > "${RUNNER_TEMP}/candidate.json"
            python -c 'import json,sys; d=json.load(open(sys.argv[1])); v=d["canonical_candidate_decision"]; print(sys.argv[2],v); sys.exit(0 if v["eligible"] else 1)' "${RUNNER_TEMP}/candidate.json" "$candidate"
          done < "${RUNNER_TEMP}/new-canonical.txt"
      - name: Prevent publishing complete caption source archives
        shell: bash
        run: |
          git diff --name-only --diff-filter=AM origin/main...HEAD > "${RUNNER_TEMP}/tracked-changes.txt"
          if grep -Ei '\.(srt|zip)$' "${RUNNER_TEMP}/tracked-changes.txt"; then
            echo "ERROR: raw SRT/ZIP must never be committed to the public repository."
            exit 1
          fi
          echo "PASS: no raw SRT or ZIP committed."
      - name: Preserve audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: subtitle-review-audit
          path: ${{ runner.temp }}/subtitle-review-audit.json
          if-no-files-found: ignore
          retention-days: 14
