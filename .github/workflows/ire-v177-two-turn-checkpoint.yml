name: V177 private actual-two-turn checkpoint contract (synthetic tests)
on:
  push:
    branches:
      - verify/ire-v6-v177-private-two-turn-checkpoint-20261119
  pull_request:
    branches:
      - verify/ire-v6-v176-engine-driven-chat-e4-20261119
  workflow_dispatch:
permissions:
  contents: read
jobs:
  two-turn-restoration-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - name: Install frozen native verification requirements
        run: python -m pip install --disable-pip-version-check -r ire/requirements-evidence-ci.txt 'cryptography==46.0.4'
      - name: V177 process-boundary recovery and existing V176 engine regressions
        working-directory: validation/ire-v6-frozen
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m compileall -q v177_private_turn_checkpoint.py
          python -m unittest -v test_v177_private_turn_checkpoint
          python -m unittest -v test_v176_chat_engine_loop