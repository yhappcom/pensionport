name: V166 E1-E7 ordered engine proof (NOT financial fact approval)
on:
  push:
    branches:
      - verify/ire-v6-v166-e1-e7-sequential-gates-20261117
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ordered-status-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - name: Validate E1-E7 strict order and never call this engine PASS
        working-directory: validation/ire-v6-frozen
        run: python -m unittest -v test_v166_gate_sequence
  e1-existing-synthetic-native-path:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - name: Install existing test dependencies
        run: python -m pip install --disable-pip-version-check -r ire/requirements-evidence-ci.txt 'cryptography==46.0.4'
      - name: V123 native synthetic -> V128 private atomic store (NOT V166 PASS)
        working-directory: validation/ire-v6-frozen
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m unittest -v test_v128_continuous_chat_atomic_parent.V128HostRunAndAtomicParentTests.test_01_two_native_v6_children_seam_and_atomic_private_parent_publication
  e1-typed-contract-connection-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - name: Identify E1 broken typed approval-to-storage route (expected E1 FAIL)
        working-directory: validation/ire-v6-frozen
        run: python v166_e1_connectivity_audit.py
  e1-source-only-native-quarantine-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - name: Install matching engine test prerequisites
        run: python -m pip install --disable-pip-version-check -r ire/requirements-evidence-ci.txt 'cryptography==46.0.4'
      - name: E1 source-only compiler and frozen V143 quarantined store regression
        working-directory: validation/ire-v6-frozen
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m unittest -v test_v166_typed_to_native_quarantine
          python -m unittest -v test_v143_v123_v128_quarantine.V143V126StoreTests.test_08_only_accepted_original_claims_are_stored_and_retrievable
          python -m unittest -v test_v143_v123_v128_quarantine.V143V128AtomicParentTests.test_10_all_excluded_child_stages_zero_then_one_parent_commit
  e1-typed-to-native-to-atomic-sqlite-same-input:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - name: Install existing engine verification requirements
        run: python -m pip install --disable-pip-version-check -r ire/requirements-evidence-ci.txt 'cryptography==46.0.4'
      - name: Same typed decision -> frozen V123 -> V127/V128 -> V126 ACID SQLite
        working-directory: validation/ire-v6-frozen
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m unittest -v test_v166_e1_same_typed_review_to_sqlite
          python -m unittest -v test_v166_typed_to_native_quarantine
  e2-source-versus-reviewer-semantic-contract-synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - name: Install existing source proof dependencies
        run: python -m pip install --disable-pip-version-check -r ire/requirements-evidence-ci.txt 'cryptography==46.0.4'
      - name: E2 conditional, fact dependency, reviewer-caution, ASR source-pin controls
        working-directory: validation/ire-v6-frozen
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m unittest -v test_v166_e2_semantic_separation
  e2-actual-v126-retrieval-separates-source-and-reviewer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - name: Install native verification requirements
        run: python -m pip install --disable-pip-version-check -r ire/requirements-evidence-ci.txt 'cryptography==46.0.4'
      - name: Real synthetic parent SQLite -> V126 retrieval -> E2 source/reviewer separated answer context
        working-directory: validation/ire-v6-frozen
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m unittest -v test_v166_e2_v126_source_separated_retrieval
          python -m unittest -v test_v166_e2_semantic_separation
  e3-chat-decision-source-checkpoint-transport:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - name: Install native V123 and V128 dependencies
        run: python -m pip install --disable-pip-version-check -r ire/requirements-evidence-ci.txt 'cryptography==46.0.4'
      - name: E3 same-chat verdict PASS/HOLD/REJECT/QUARANTINE -> V127 checkpoint -> V128 parent
        working-directory: validation/ire-v6-frozen
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m unittest -v test_v166_e3_chat_decision_delivery
          python -m unittest -v test_v166_e1_same_typed_review_to_sqlite
  e4-primary-authenticity-and-parent-release-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - name: Install native engine E4 prerequisites
        run: python -m pip install --disable-pip-version-check -r ire/requirements-evidence-ci.txt 'cryptography==46.0.4'
      - name: Mocked HTTPS official fixture policy PASS and E3/V128 ACID reject paths
        working-directory: validation/ire-v6-frozen
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m unittest -v test_v166_e4_primary_approval_gate
          python -m unittest -v test_v166_e4_bibliographic_primary
          python -m unittest -v test_v166_e4_sealed_knowledge
          python -m unittest -v test_v166_e4_operator_trust
          python -m unittest -v test_v166_e4_typed_authority
          python -m unittest -v test_v166_e4_typed_nonstatutory
          python -m unittest -v test_v166_e4_pabrai_partnership_context
          python -m unittest -v test_v166_e4_mixed_native_parent
          python -m unittest -v test_v166_e4_certified_source_retrieval
          python -m unittest -v test_v166_e4_video_book_source_custody
          python -m unittest -v test_v166_e4_owner_open_partial_source
          python -m unittest -v test_v166_e4_full_eight_open_census
          python -m unittest -v test_v166_e4_corporate_historical_primary
          python -m unittest -v test_v166_e4_legacy_ungated_path_diagnostic
          python -m unittest -v test_v166_e3_chat_decision_delivery
