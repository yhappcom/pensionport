name: V3.3 Holdout Source Overlap Preflight (Synthetic Only)
on:
  push:
    branches:
      - feat/v33-holdout-overlap-preflight-20261031
  pull_request:
    paths:
      - scripts/v33_source_overlap_gate.py
      - scripts/verify_v33_source_overlap_gate.py
      - .github/workflows/v33-holdout-overlap-preflight.yml
jobs:
  synthetic-source-overlap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run private-data-free synthetic guard regression
        run: python -B scripts/verify_v33_source_overlap_gate.py
      - name: Assert existing V3.3 frozen intake remains unchanged
        run: python -B scripts/verify_v30_v33_intake.py --root . --assert-snapshot
