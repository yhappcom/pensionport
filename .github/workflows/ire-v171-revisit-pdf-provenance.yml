name: V171 no-API revisit & PDF-derived research provenance (synthetic)
on:
  push:
    branches:
      - verify/ire-v6-v171-revisit-pdf-provenance-20261119
  pull_request:
    branches:
      - verify/ire-v6-v170-chat-boundary-revisit-20261119
  workflow_dispatch:
permissions:
  contents: read
jobs:
  in-chat-revisit-and-pdf-evidence-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - name: Install frozen-native CI requirements
        run: python -m pip install --disable-pip-version-check -r ire/requirements-evidence-ci.txt 'cryptography==46.0.4'
      - name: V171 provenance/revisit controls and V167-V170 regression
        working-directory: validation/ire-v6-frozen
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m compileall -q v171_in_chat_revisit_bridge.py v171_pdf_research_evidence.py
          python -m unittest -v test_v171_in_chat_revisit_bridge test_v171_pdf_research_evidence
          python -m unittest -v test_v170_in_chat_review_bridge test_v170_evidence_revisit test_v170_native_in_chat_interop
          python -m unittest -v test_v167_chat_research_loop test_v168_chat_native_replay test_v169_chat_research_journal test_v169_native_interop
          python -m unittest -v test_v166_e4_full_video_readiness