name: V176 engine-driven in-chat E4 loop (synthetic tests only)
on:
  push:
    branches:
      - verify/ire-v6-v176-engine-driven-chat-e4-20261119
  pull_request:
    branches:
      - verify/ire-v6-v175-fresh-native-host-batch-20261119
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-to-chat-interactive-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - name: Install original frozen V6/E4 dependencies
        run: python -m pip install --disable-pip-version-check -r ire/requirements-evidence-ci.txt 'cryptography==46.0.4'
      - name: Genuine frozen V6 audit + engine work request / ChatGPT return protocol (synthetic host)
        working-directory: validation/ire-v6-frozen
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m unittest -v test_v176_chat_engine_loop
          python -m unittest -v test_v174_fresh_to_native_v6
          python -m unittest -v test_v173_e4_only_parent
          python -m unittest -v test_v172_full_video_engine