name: V180 source-only real owner issues / frozen native regression (synthetic CI)
on:
  push:
    branches:
      - verify/ire-v6-v180-source-gap-kind-semantic-20261119
  pull_request:
    branches:
      - verify/ire-v6-v179-owner-two-turn-native-replay-20261119
  workflow_dispatch:
permissions:
  contents: read
jobs:
  semantic-correction-and-native-frozen-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - name: Install official frozen V6 test dependencies
        run: python -m pip install --disable-pip-version-check -r ire/requirements-evidence-ci.txt 'cryptography==46.0.4'
      - name: Frozen V6 audit and V180 source-disposition regression (synthetic)
        working-directory: validation/ire-v6-frozen
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m compileall -q v176_chat_engine_loop.py v176_chat_engine_cli.py v180_source_residual_gate.py
          python -m unittest -v test_v180_source_semantic_repairs
          python -m unittest -v test_v179_noatom_risk_revisit test_v179_provisional_claim_projection
          python -m unittest -v test_v178_coldstart_chat_packet_bridge test_v177_private_turn_checkpoint test_v176_chat_engine_loop
          python -m unittest -v test_v166_e4_full_video_readiness