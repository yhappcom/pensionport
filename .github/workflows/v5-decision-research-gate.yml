name: V5 research provenance and privacy gate

on:
  push:
    branches:
      - feat/v5-personal-investment-advisor-20261030
    paths:
      - "v5/**"
      - "scripts/verify_v5_reaudit.py"
      - "scripts/verify_v5_one_turn_advisory_gate.py"
      - "scripts/verify_v5_legacy_closeout.py"
      - "scripts/verify_v5_public_evidence_suitability_gate.py"
      - "scripts/verify_v5_research_completion.py"
      - "scripts/verify_v5_research_pilot_001.py"
      - "scripts/verify_v5_001_research_progress.py"
      - "scripts/verify_v5_001_private_srt.py"
      - "scripts/verify_v5_knowledge_integration.py"
      - "scripts/evaluate_v5_001_010_synthesis.py"
      - ".github/workflows/v5-decision-research-gate.yml"
  pull_request:
    paths:
      - "v5/**"
      - "scripts/verify_v5_reaudit.py"
      - "scripts/verify_v5_one_turn_advisory_gate.py"
      - "scripts/verify_v5_legacy_closeout.py"
      - "scripts/verify_v5_public_evidence_suitability_gate.py"
      - "scripts/verify_v5_research_completion.py"
      - "scripts/verify_v5_research_pilot_001.py"
      - "scripts/verify_v5_001_research_progress.py"
      - "scripts/verify_v5_001_private_srt.py"
      - "scripts/verify_v5_knowledge_integration.py"
      - "scripts/evaluate_v5_001_010_synthesis.py"
      - ".github/workflows/v5-decision-research-gate.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate 122 source claims, four contradictions, zero user records
        run: |
          python -m py_compile scripts/verify_v5_reaudit.py
          python -B scripts/verify_v5_reaudit.py --root . --self-test
      - name: Validate mandatory one-turn research modules and adversarial cases
        run: |
          python -m py_compile scripts/verify_v5_one_turn_advisory_gate.py
          python -B scripts/verify_v5_one_turn_advisory_gate.py --root . --self-test
      - name: V5 001-010 original source, arithmetic and evidence limitations
        run: |
          python -m py_compile scripts/verify_v5_legacy_closeout.py
          python -B scripts/verify_v5_legacy_closeout.py --root . --self-test
      - name: Verify public source scope and prohibit automatic personalized approval
        run: |
          python -m py_compile scripts/verify_v5_public_evidence_suitability_gate.py
          python -B scripts/verify_v5_public_evidence_suitability_gate.py --root . --self-test
      - name: Enforce independent research completion; reject missing evidence
        run: |
          python -m py_compile scripts/verify_v5_research_completion.py
          python -B scripts/verify_v5_research_completion.py --root . --self-test
      - name: Real video 001 - verify 23 legacy claims, 42 atomic items and adverse mutations
        run: |
          python -m py_compile scripts/verify_v5_research_pilot_001.py
          python -B scripts/verify_v5_research_pilot_001.py --root . --self-test
      - name: Video 001 - drive 42 atomic evidence and replay five numeric models
        run: |
          python -m py_compile scripts/verify_v5_001_research_progress.py
          python -B scripts/verify_v5_001_research_progress.py --root . --self-test --plan
      - name: Video 001 - verify raw source provenance hashes and core cue ranges (no private ZIP)
        run: |
          python -m py_compile scripts/verify_v5_001_private_srt.py
          python -B scripts/verify_v5_001_private_srt.py --root . --self-test
      - name: Compare incremental claims to 16 canonical concepts; reject unreviewed merges and overwrites
        run: |
          python -m py_compile scripts/verify_v5_knowledge_integration.py
          python -B scripts/verify_v5_knowledge_integration.py --root . --self-test --preview
      - name: Benchmark historical 1-10 claim synthesis and adversarial cases
        run: |
          python -m py_compile scripts/evaluate_v5_001_010_synthesis.py
          python -B scripts/evaluate_v5_001_010_synthesis.py --root . --self-test
      - name: Reject private asset files in V5
        shell: bash
        run: |
          if git ls-files -- 'v5/**' | grep -Ei '\.(csv|xlsx|xls|zip|srt|pdf|sqlite|db|pem)$'; then
            echo "ERROR: forbidden data file in v5"; exit 1
          fi
          if git ls-files -- 'v5/private/**' 'v5/actual/**' 'v5/output/**' 'v5/accounts/**' | grep -q .; then
            echo "ERROR: forbidden private data path"; exit 1
          fi
          echo "PASS: no private file types or folders in V5"
