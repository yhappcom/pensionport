name: IRE single integration branch, legacy history and research governance guard
on:
  push:
    branches: [audit/full-repository-snapshot-20261122]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  branch_governance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Verify no branch proliferation, unchanged main, all 98 historic heads, research policy
        run: |
          git clone --mirror https://github.com/yhappcom/pensionport.git mirror.git
          python - <<'PY'
          import json, subprocess
          base=['git','-C','mirror.git']
          def git(*args):
              return subprocess.check_output(base+list(args),text=True).strip()
          integration='audit/full-repository-snapshot-20261122'
          hist='3d1beba08ea3037df3c6c46f21cff9a5bb0374db'
          registry=json.loads(git('show','refs/heads/'+integration+':docs/BRANCH_HEADS_CONSOLIDATION_REGISTRY_20261122.json'))
          original={x['name']:x['sha'] for x in registry['branches']}
          assert registry['branch_count']==len(original)==98
          refs=set(git('for-each-ref','refs/heads','--format=%(refname:short)').splitlines())
          assert refs=={'main',integration}, 'BRANCH_COUNT_OR_NAME_POLICY_VIOLATION:'+str(sorted(refs))
          assert git('rev-parse','refs/heads/main')==registry['preserved_main_sha'], 'MAIN_MOVED'
          head=git('rev-parse','refs/heads/'+integration)
          assert subprocess.run(base+['merge-base','--is-ancestor',hist,head]).returncode==0
          parent=git('show','--format=%P','--no-patch',hist).split()
          assert len(parent)==12
          assert git('rev-parse',hist+'^{tree}')==git('rev-parse',parent[0]+'^{tree}'), 'UNREVIEWED_LEGACY_CODE_PROMOTED'
          missing=[]
          for name,sha in original.items():
              if subprocess.run(base+['merge-base','--is-ancestor',sha,head],
                 stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode:missing.append(name)
          assert not missing, 'ORIGINAL_BRANCH_HEAD_NOT_REACHABLE:'+str(missing)
          policy=git('show','refs/heads/'+integration+':docs/BRANCH_LIFECYCLE_AND_RESEARCH_CLOSEOUT_POLICY_20261122.md')
          assert '2턴' in policy and '연구' in policy and '브랜치' in policy
          names=git('show','refs/heads/'+integration+':docs/BRANCH_DIVERGENT_BLOB_CATALOG_20261122.tsv').splitlines()
          assert len(names)==5940, 'DIVERGENT_FILE_CATALOG_TRUNCATED'

          # Preserve research HOLD across branch/PR closeout; history is not knowledge approval.
          closed=json.loads(git('show','refs/heads/'+integration+':docs/BRANCH_LEGACY_PR_CLOSEOUT_RESULT_20261122.json'))
          transferred=json.loads(git('show','refs/heads/'+integration+':docs/BRANCH_LEGACY_PR_RESEARCH_TRANSFER_20261122.json'))
          receipt=json.loads(git('show','refs/heads/'+integration+':docs/BRANCH_RETIREMENT_DURABLE_ATTESTATION_20261122.json'))
          citems={x['number']:x for x in closed['items']}
          titems={x['number']:x for x in transferred['items']}
          assert len(citems)==len(titems)==closed['original_open_prs']==closed['verified_closed_prs']==transferred['pr_count']==42, 'LEGACY_PR_CLOSEOUT_COUNT_OR_DUPLICATE'
          assert set(citems)==set(titems), 'LEGACY_PR_TRANSFER_MISMATCH'
          assert closed['main_merge_count']==0, 'MAIN_PR_MERGE_VIOLATION'
          for n,c in citems.items():
              t=titems[n]
              assert c['head_branch']==t['head_branch'] and c['head_sha']==t['head_sha']==original[t['head_branch']], 'PR_ORIGINAL_HEAD_DRIFT:'+str(n)
              assert c['closed_confirmed'] and c['history_integrated'] and not c['merged_into_main'], 'LEGACY_PR_NOT_ARCHIVED:'+str(n)
              assert c['research_status'].startswith('CLOSED_WITH_EXPLICIT_HOLD_TRANSFER'), 'FALSE_RESEARCH_APPROVAL:'+str(n)
              assert not t['e3_final_approved'] and not t['e4_authorized'] and not t['e5_knowledge_published'], 'FALSE_E3_E4_E5_PROMOTION:'+str(n)
          assert receipt['original_branch_count']==98 and receipt['deleted_branch_count']==96 and receipt['failed_branch_count']==0 and receipt['skipped_branch_count']==0, 'RETIREMENT_RECEIPT_COUNT'
          assert receipt['original_heads_reachable_before_deletion']==98 and receipt['original_open_pr_count']==42 and receipt['original_open_prs_closed_before_deletion'], 'RETIREMENT_RECEIPT_INCOMPLETE'
          assert receipt['main_head']==registry['preserved_main_sha'] and receipt['octopus_history_commit']==hist, 'RETIREMENT_HISTORY_MISMATCH'
          assert set(receipt['preserved_branches'])==refs, 'RETIREMENT_PRESERVED_BRANCH_MISMATCH'
          assert receipt['source_artifact_zip_sha256']=='5828cea7a4bfd71ec6f10fc8b0839607fae92c115435c612eddc0f318c6ea98b', 'DELETION_ARTIFACT_DIGEST_DRIFT'
          assert '## E. 브랜치 증가 탐지의 범위와 관리자 사전 차단' in policy, 'BRANCH_MONITORING_LIMITATIONS_UNDOCUMENTED'
          print('RESEARCH_HOLD_ARCHIVE_PASS closed_legacy_prs=42 false_e3_e4_e5_approvals=0 retired=96 artifact_digest_pinned=1')
          print('BRANCH_GOVERNANCE_PASS active=2 archived_heads=98 all_legacy_files_indexed=5939 main_unchanged='+registry['preserved_main_sha'])
          PY

      - name: Checkout current single integration branch for strict execution gate
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Setup pinned Python for checklist enforcement
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - name: Test all positive and negative sequential-policy cases
        run: |
          python -m unittest -v scripts.test_ire_checklist_gate
      - name: Enforce current 60-item checklist and immutable past PASS
        run: |
          python scripts/ire_checklist_gate.py verify --compare-parent
          python scripts/ire_checklist_gate.py status
      - name: Reject false current E1-E5 advisory GO and denominator mixing
        run: |
          python -m unittest -v scripts.test_ire_current_status_gate
          python scripts/ire_current_status_gate.py verify
          python scripts/ire_current_status_gate.py status

      - name: Audit all 27 workflows, retired triggers and read-only permissions
        run: |
          python -m unittest -v scripts.test_ire_workflow_audit_gate
          python scripts/ire_workflow_audit_gate.py verify
          python scripts/ire_workflow_audit_gate.py status



      - name: Prove 11 historic branches, 1103 path dispositions, 42 unmerged PR and open issues
        run: |
          python -m unittest -v scripts.test_ire_legacy_transfer_gate
          python scripts/ire_legacy_transfer_gate.py verify
          python scripts/ire_legacy_transfer_gate.py status

      - name: P0-0-06 verify 42 public archive blobs (historical recovery still unverified)
        run: |
          python -m unittest -v scripts.test_ire_security_archive_gate
          python scripts/ire_security_archive_gate.py verify
          # A passing audit does not imply content confidentiality or key recovery.

      - name: P0-0-07 verify stage closeout, preserve financial HOLD, and open only E1 first item
        run: |
          python -m unittest -v scripts.test_ire_p0_0_closeout_gate
          python -m scripts.ire_p0_0_closeout_gate verify

      - name: P0-1-01 verify one official API and no core CLI (external bypass still HOLD)
        run: |
          python -m unittest -v scripts.test_ire_p0_1_01_surface_gate
          python -m scripts.ire_p0_1_01_surface_gate verify

      - name: P0-1-05 final E1 software scope audit, ETF real E1-E5 HOLD
        run: |
          python -m unittest -v scripts.test_ire_p0_1_05_stage_gate
          python -m scripts.ire_p0_1_05_stage_gate verify

      - name: P0-2-01 ETF real private cue 250 source-first SHA-only disposition and false-GO review
        run: |
          python -m unittest -v scripts.test_ire_p0_2_01_source_first_gate
          python -m scripts.ire_p0_2_01_source_first_gate verify

      - name: P0-2-02 68 atom source-first cross-child 21 and 49 foreign-edge SHA-only decisions
        run: |
          python -m unittest -v scripts.test_ire_p0_2_02_adjudication_gate
          python -m scripts.ire_p0_2_02_adjudication_gate

      - name: P0-2-03 ETF 250 cue six-axis semantics and 68 unapproved atom guarded triage
        run: |
          python -m unittest -v scripts.test_ire_p0_2_03_six_axis_gate
          python -m scripts.ire_p0_2_03_six_axis_gate

      - name: P0-2-04 Issue 48 50 adversarial RED-GREEN and no false research completion
        run: |
          python -m unittest -v scripts.test_ire_p0_2_04_adversarial_gate
          python -m scripts.ire_p0_2_04_adversarial_gate

      - name: P0-2-05 keep independent gold UNMEASURABLE while source-only blind intake is not reviewed
        run: |
          python -m unittest -v scripts.test_ire_p0_2_05_gold_readiness_gate
          python -m scripts.ire_p0_2_05_gold_readiness_gate

      - name: P0-2-05 source-first 71 native 68 non-independent topic audit and false GO prevention
        run: |
          python -m unittest -v scripts.test_ire_p0_2_05_source71_compare_gate
          python -m scripts.ire_p0_2_05_source71_compare_gate

      - name: P0-2-05 reconcile 11 source-native raw kind disagreements without laundering semantic gold
        run: |
          python -m unittest -v scripts.test_ire_p0_2_05_kind_triage_gate
          python -m scripts.ire_p0_2_05_kind_triage_gate

      - name: P0-2-05 root-cause independent gold fail closed and 24 production fake-proof mutations
        run: |
          python -m unittest -v scripts.test_ire_p205_live_release
          python -m unittest -v scripts.test_ire_p0_2_05_root_cause_gate
          python -m scripts.ire_p0_2_05_root_cause_gate

  engine_strict_v3_v5_v6:
    name: P0-0-04 strict V3 V5 V6 entire code tree / same SHA
    needs: branch_governance
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - name: Prove pinned Python, exact push SHA, and unmodified main
        env:
          EXPECTED_MAIN_SHA: d613fd201f4bb077f1ccc74d28dee937b11bfcb2
        run: |
          python - <<'PY'
          import os, subprocess, sys
          git=lambda *xs: subprocess.check_output(['git',*xs],text=True).strip()
          assert sys.version_info[:3] == (3,11,18), 'PYTHON_VERSION_DRIFT'
          assert git('rev-parse','HEAD') == os.environ['GITHUB_SHA'], 'HEAD_SHA_MISMATCH'
          assert git('rev-parse','origin/main') == os.environ['EXPECTED_MAIN_SHA'], 'MAIN_MOVED'
          print('IRE_EXACT_SHA_ENV_PASS',os.environ['GITHUB_SHA'],sys.version)
          PY
      - name: Install pinned source and signature dependencies
        run: |
          python -m pip install --disable-pip-version-check -r ire/requirements-evidence-ci.txt 'cryptography==46.0.4'
      - name: Strict frozen V6 driver runs V6 and ALL six V3 V5 cross-version gates
        run: python -m ire.v6.prepush --strict --root . --expected-sha "$GITHUB_SHA"
      - name: Additional P4 scoped read-only knowledge retrieval
        run: python -m ire.v5.p4_active_integration --root .
      - name: Report no tracked code or legacy dataset mutation after suites
        run: |
          test -z "$(git status --porcelain --untracked-files=no)"
          echo "IRE_V3_V5_V6_STRICT_SAME_SHA_PASS $GITHUB_SHA"

  frozen_regression_matrix:
    name: P0-0-04 frozen E1-E5 offline regression / ${{ matrix.cohort }}
    needs: branch_governance
    # Frozen V176/V177 CLI subprocesses execute a script path directly and
    # require explicit project-root import visibility (not PYTHONPATH=tests).
    env:
      PYTHONPATH: ${{ github.workspace }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - cohort: v60_v99_historical
            pattern: 'test_v[6-9]*.py'
          - cohort: v100_v199_semantic_finance_v123_v126_e3_e4_e5
            pattern: 'test_v1*.py'
          - cohort: v200_v242_current_e1_e2_e3_e4_bridge
            pattern: 'test_v2*.py'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - name: Install pinned deterministic dependencies
        run: |
          python -m pip install --disable-pip-version-check -r ire/requirements-evidence-ci.txt 'cryptography==46.0.4'
      - name: Verify exact common Git commit and strict frozen cohort coverage
        env:
          TEST_GLOB: ${{ matrix.pattern }}
        run: |
          python - <<'PY'
          import fnmatch,os,pathlib,subprocess,sys
          assert sys.version_info[:3]==(3,11,18)
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==os.environ['GITHUB_SHA']
          roots=pathlib.Path('validation/ire-v6-frozen')
          matches=sorted(x.name for x in roots.glob('test_*.py') if fnmatch.fnmatch(x.name,os.environ['TEST_GLOB']))
          assert matches, 'FROZEN_COHORT_EMPTY'
          print('FROZEN_TEST_COHORT',os.environ['TEST_GLOB'],len(matches),matches[0],matches[-1])
          PY
      - name: Run full frozen regression cohort (synthetic, does not certify financial release)
        env:
          TEST_GLOB: ${{ matrix.pattern }}
        run: |
          python -m unittest discover -s validation/ire-v6-frozen -p "$TEST_GLOB" -v
      - name: Prove no tracked research/protected source mutation
        run: |
          test -z "$(git status --porcelain --untracked-files=no)"
          echo "FROZEN_TEST_COHORT_PASS ${{ matrix.cohort }} $GITHUB_SHA"

  frozen_official_source_policy:
    name: P0-0-04 offline primary-evidence policies and original scope
    needs: branch_governance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - name: Install pinned government-PDF fixture dependencies
        run: |
          python -m pip install --disable-pip-version-check -r ire/requirements-evidence-ci.txt 'cryptography==46.0.4'
      - name: Run all non-versioned frozen tests from the same HEAD
        run: |
          python - <<'PY'
          import pathlib,subprocess,sys,os
          assert sys.version_info[:3]==(3,11,18)
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==os.environ['GITHUB_SHA']
          root=pathlib.Path('validation/ire-v6-frozen')
          files=sorted(p for p in root.glob('test_*.py') if not p.name.startswith('test_v'))
          assert files, 'NO_OFFICIAL_SOURCE_TESTS'
          # These are deterministic/fixture tests; live KRX download is not an approval gate.
          print('OFFLINE_PRIMARY_POLICY_TEST_FILES',len(files),*[p.name for p in files])
          for p in files:
              r=subprocess.run([sys.executable,'-m','unittest','discover','-s',str(root),'-p',p.name,'-v'],check=False)
              if r.returncode:
                  sys.exit(r.returncode)
          PY
      - name: Forbid tracked data edits in official policy replay
        run: test -z "$(git status --porcelain --untracked-files=no)"
