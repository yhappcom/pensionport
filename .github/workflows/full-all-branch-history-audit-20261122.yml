name: Full all-branch git history offline consolidation snapshot
on:
  push:
    branches:
      - audit/full-repository-snapshot-20261122
  workflow_dispatch:
permissions:
  contents: read
jobs:
  git_bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Fetch all branch refs and git history (read-only)
        run: |
          git clone --mirror https://github.com/yhappcom/pensionport.git mirror.git
          python - <<'PY'
          import json, subprocess, sys
          def run(*a):
              return subprocess.check_output(['git','-C','mirror.git',*a],text=True).strip()
          ledger=json.loads(run('show','refs/heads/audit/full-repository-snapshot-20261122:docs/BRANCH_HEADS_CONSOLIDATION_REGISTRY_20261122.json'))
          merged=run('rev-parse','refs/heads/audit/full-repository-snapshot-20261122')
          main=run('rev-parse','refs/heads/main')
          assert main==ledger['preserved_main_sha'], 'MAIN_MOVED'
          refs=dict(l.split(' ',1)[::-1] for l in run('for-each-ref','refs/heads','--format=%(objectname) %(refname:short)').splitlines())
          original={x['name']:x['sha'] for x in ledger['branches']}
          assert len(original)==98 and ledger['branch_count']==98
          illegal=set(refs)-set(original)
          assert not illegal, 'NEW_BRANCHES_FORBIDDEN: '+str(sorted(illegal))
          assert len(refs)<=98, 'BRANCH_COUNT_INCREASED'
          missing=[]
          for x in ledger['branches']:
              p=subprocess.run(['git','-C','mirror.git','merge-base','--is-ancestor',x['sha'],merged],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
              if p.returncode:missing.append(x['name'])
          assert not missing, 'MISSING_BRANCH_HISTORY:'+str(missing)
          ps=run('show','--format=%P','--no-patch',merged).split()
          assert len(ps)>=12, 'MULTIPARENT_HISTORY_MERGE_MISSING'
          assert run('rev-parse',merged+'^{tree}')==run('rev-parse',ps[0]+'^{tree}'), 'UNREVIEWED_CODE_PROMOTED'
          print('ALL_98_BRANCH_HEADS_PRESERVED_PASS',len(original),'remaining_refs',len(refs),'main_unchanged',main)
          PY
          git -C mirror.git show-ref --heads | sort > /tmp/all-branches-refs.txt
          test "$(wc -l </tmp/all-branches-refs.txt)" -ge 90
          git -C mirror.git bundle create /tmp/pensionport-all-branches.bundle --all
          git -C mirror.git bundle verify /tmp/pensionport-all-branches.bundle
          sha256sum /tmp/pensionport-all-branches.bundle /tmp/all-branches-refs.txt > /tmp/all-branch-shas.txt
          cat /tmp/all-branch-shas.txt
          wc -l /tmp/all-branches-refs.txt
      - name: Upload offline history and branch head manifest (no source modification)
        uses: actions/upload-artifact@v4
        with:
          name: pensionport-complete-branch-history-20261122
          path: |
            /tmp/pensionport-all-branches.bundle
            /tmp/all-branches-refs.txt
            /tmp/all-branch-shas.txt
          if-no-files-found: error
          retention-days: 1
