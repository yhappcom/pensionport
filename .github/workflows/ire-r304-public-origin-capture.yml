name: R3-04 public official response byte acquisition (not approval)
on:
  push:
    branches: [audit/full-repository-snapshot-20261122]
    paths:
      - 'scripts/ire_r304_public_origin_capture.py'
      - '.github/workflows/ire-r304-public-origin-capture.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-origin-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - name: Capture bounded public official HTML responses (fail closed)
        run: python scripts/ire_r304_public_origin_capture.py "$RUNNER_TEMP/r304-public-origin"
      - name: Preserve public responses and receipt only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r304-public-origin-unapproved
          path: ${{ runner.temp }}/r304-public-origin/
          retention-days: 1
          if-no-files-found: error
