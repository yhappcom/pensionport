name: IRE V5 standalone transaction core
on:
  push:
    branches:
      - feat/ire-v5-vertical-slice-20261103
    paths:
      - 'ire/v5/**'
      - '.github/workflows/ire-v5-transaction-core.yml'
  workflow_dispatch:
# Keep the latest commit's checks; no bypass for actual regressions.
concurrency:
  group: ire-v5-standalone-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolated-v5-core:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned crypto dependency
        run: python -m pip install 'cryptography==46.0.4'
      - name: Execute unified local/CI fail-closed preflight
        run: python -m ire.v5.preflight --root .
