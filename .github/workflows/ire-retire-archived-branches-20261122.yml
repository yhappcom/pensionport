name: Safely retire archived branches after full-history integration
on:
  push:
    branches: [audit/full-repository-snapshot-20261122]
permissions:
  contents: write
  pull-requests: read
jobs:
  safe_retire:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Verify unchanged main, original 98 heads, all historical research PRs closed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --mirror https://github.com/yhappcom/pensionport.git mirror.git
          python - <<'PY'
          import json, os, subprocess, urllib.request, urllib.parse, urllib.error, pathlib, sys
          repo='yhappcom/pensionport'
          integration='audit/full-repository-snapshot-20261122'
          protected={'main',integration}
          history_merge='3d1beba08ea3037df3c6c46f21cff9a5bb0374db'
          token=os.environ.get('GH_TOKEN','')
          assert token, 'MISSING_GITHUB_TOKEN'
          def git(*args):
              return subprocess.check_output(['git','-C','mirror.git',*args],text=True).strip()
          def api(method,path):
              url='https://api.github.com/repos/'+repo+'/'+path
              req=urllib.request.Request(url,method=method,headers={
                  'Accept':'application/vnd.github+json',
                  'Authorization':'Bearer '+token,
                  'X-GitHub-Api-Version':'2022-11-28',
                  'User-Agent':'IRE-Branch-Retirement-20261122'})
              with urllib.request.urlopen(req,timeout=30) as response:
                  raw=response.read()
                  return json.loads(raw) if raw else None
          registry=json.loads(git('show','refs/heads/'+integration+':docs/BRANCH_HEADS_CONSOLIDATION_REGISTRY_20261122.json'))
          original={x['name']:x['sha'] for x in registry['branches']}
          assert len(original)==registry['branch_count']==98
          current=git('rev-parse','refs/heads/'+integration)
          main=git('rev-parse','refs/heads/main')
          assert main==registry['preserved_main_sha'], 'MAIN_SHA_CHANGED'
          assert subprocess.run(['git','-C','mirror.git','merge-base','--is-ancestor',history_merge,current]).returncode==0
          ps=git('show','--no-patch','--format=%P',history_merge).split()
          assert len(ps)==12 and git('rev-parse',history_merge+'^{tree}')==git('rev-parse',ps[0]+'^{tree}')
          ref_names=set(git('for-each-ref','refs/heads','--format=%(refname:short)').splitlines())
          assert not ref_names-set(original), 'UNKNOWN_BRANCH_ADDED'
          assert len(ref_names)<=98
          for name,sha in original.items():
              assert subprocess.run(['git','-C','mirror.git','merge-base','--is-ancestor',sha,current],
                                    stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode==0, 'NOT_ARCHIVED:'+name
          prs=api('GET','pulls?state=open&per_page=100')
          assert not prs, 'OPEN_PRS_MUST_BE_CLOSED_AND_RESEARCH_TRANSFERRED'
          must_exist=['docs/BRANCH_CONSOLIDATION_20261122.md','docs/BRANCH_LIFECYCLE_AND_RESEARCH_CLOSEOUT_POLICY_20261122.md',
            'docs/BRANCH_LEGACY_PR_RESEARCH_TRANSFER_20261122.json','docs/BRANCH_DIVERGENT_BLOB_CATALOG_20261122.tsv']
          for path in must_exist:assert git('cat-file','-e',current+':'+path)==''  # raises if missing
          plan=[x for x in registry['branches'] if x['name'] not in protected and x['name'] in ref_names]
          print('SAFE_CLEANUP_PREFLIGHT_PASS','all_history_heads',len(original),
                'open_prs',len(prs),'requested_deletions',len(plan),'main',main,'current',current,flush=True)
          deleted=[]; skipped=[];failed=[]
          try:
              for item in plan:
                  name=item['name'];sha=item['sha']
                  escaped=urllib.parse.quote(name,safe='/')
                  try:
                      current_ref=api('GET','git/ref/heads/'+escaped)
                      if current_ref['object']['sha']!=sha:
                          skipped.append({'name':name,'reason':'HEAD_SHA_CHANGED'})
                          continue
                      branch_data=api('GET','branches/'+escaped)
                      if branch_data.get('protected'):
                          skipped.append({'name':name,'reason':'BRANCH_PROTECTED'})
                          continue
                      api('DELETE','git/refs/heads/'+escaped)
                      deleted.append(name)
                      print('DELETED_WITH_HISTORY_SAFETY',name,flush=True)
                  except urllib.error.HTTPError as e:
                      failed.append({'name':name,'http_status':e.code,'detail':e.read().decode('utf-8','replace')[:160]})
                      print('DELETE_DENIED_OR_FAILED',name,e.code,flush=True)
          finally:
              report={'schema':'IRE_20261122_BRANCH_RETIREMENT',
                  'original_count':len(original),'original_heads_reachable':len(original),
                  'deleted':deleted,'skipped':skipped,'failed':failed,
                  'main_head_before':main,'integration_head':current,
                  'all_open_prs_closed_before_deletion':True}
              pathlib.Path('branch-retirement-result.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
              print('BRANCH_RETIREMENT_RESULT','deleted',len(deleted),
                    'skipped',len(skipped),'failed',len(failed),flush=True)
          if failed or skipped:sys.exit('BRANCH_RETIREMENT_INCOMPLETE')
          PY
      - name: Preserve retirement proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ire-branch-retirement-evidence-20261122
          path: branch-retirement-result.json
          if-no-files-found: warn
          retention-days: 30
