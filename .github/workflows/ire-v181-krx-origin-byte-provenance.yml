name: V181 issuer public HTML byte provenance (not E4 approval)
on:
  push:
    branches:
      - verify/ire-v6-v179-real-two-turn-source-firstpass-20261119
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture-public-krx:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch exact official-public HTML over HTTPS, fail closed
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json,datetime,ssl,urllib.request,urllib.parse,pathlib
          root=pathlib.Path('krx-origin-byte-capture')
          root.mkdir()
          urls=[
            ('krx_nav','https://www.krx.co.kr/contents/OPN/01/01030203/OPN01030203T1.jsp'),
            ('krx_tracking','https://www.krx.co.kr/contents/OPN/01/01030203/OPN01030203T2.jsp'),
            ('krx_lp_rules','https://regulation.krx.co.kr/contents/RGL/03/03060103/RGL03060103.jsp')
          ]
          host_allow={'www.krx.co.kr','regulation.krx.co.kr','open.krx.co.kr'}
          results=[]
          for name,url in urls:
              req=urllib.request.Request(url,headers={
                'User-Agent':'Mozilla/5.0 V181 primary origin provenance probe',
                'Accept':'text/html,application/xhtml+xml'})
              try:
                with urllib.request.urlopen(req,timeout=20,context=ssl.create_default_context()) as resp:
                  final=resp.geturl()
                  if urllib.parse.urlparse(final).scheme!='https' or urllib.parse.urlparse(final).hostname not in host_allow:
                    raise ValueError('HTTP_REDIRECT_NOT_OFFICIAL_KRX_HTTPS')
                  if resp.status!=200:raise ValueError('NON_200')
                  body=resp.read(2500001)
                  if not body or len(body)>2500000:raise ValueError('EMPTY_OR_TOO_BIG')
                  mime=resp.headers.get('Content-Type','')
                  if not any(m in mime.lower() for m in ('text/html','application/xhtml')):
                    raise ValueError('NOT_HTML')
                  (root/(name+'.html')).write_bytes(body)
                  results.append({'key':name,'requested_url':url,'final_url':final,
                    'http_status':resp.status,'content_type':mime,
                    'observed_date_header':resp.headers.get('Date'),
                    'sha256':hashlib.sha256(body).hexdigest(),'raw_bytes':len(body),
                    'https_tls_validation':'stdlib_SSL_default_context',
                    'issuer_effective_date_verified':False,
                    'regulatory_applicability_verified':False,
                    'v123_e4_approved':False})
              except Exception as exc:
                results.append({'key':name,'requested_url':url,'failed_closed':True,
                                'failure_type':type(exc).__name__,'reason':str(exc)[:240]})
          report={'schema':'V181_KRX_PRIMARY_ORIGIN_BYTES_UNAPPROVED_V1',
                  'retrieved_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),
                  'source_video_original_sha256':'e4aef32c007bc5e9f1ac6c3e18764ddc1b766e430893127cf98abe632c70301b',
                  'private_source_transferred_to_ci':False,
                  'authority_current_effective_date_verified':False,
                  'legal_investor_scope_verified':False,
                  'v123_e4_approved':False,'e5_authorized':False,'results':results}
          (root/'provenance_sha_only.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          print(json.dumps({'success_count':sum('sha256' in x for x in results),
                            'failure_count':sum(x.get('failed_closed',False) for x in results),
                            'results':[{'key':x['key'],'status':x.get('http_status','BLOCKED'),
                                        'sha256':x.get('sha256')} for x in results]}))
          PY
      - name: Upload public official website bytes and SHA receipt (no owner data)
        uses: actions/upload-artifact@v4
        with:
          name: v181-public-krx-html-byte-provenance-unapproved
          path: krx-origin-byte-capture/
          retention-days: 1
          if-no-files-found: error
