name: V172 exhaustive E4 child checks and guarded V128 parent (synthetic)
on:
  push:
    branches:
      - verify/ire-v6-v172-exhaustive-video-engine-20261119
  pull_request:
    branches:
      - verify/ire-v6-v171-source-semantic-split-20261119
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exhaustive-native-e4-and-parent:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - name: Install frozen V6 primary evidence dependencies
        run: python -m pip install --disable-pip-version-check -r ire/requirements-evidence-ci.txt 'cryptography==46.0.4'
      - name: Exercise E4 complete-video preflight and actual frozen V123/V128 parent
        working-directory: validation/ire-v6-frozen
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m unittest -v test_v172_full_video_engine
          python -m unittest -v test_v166_e4_primary_approval_gate
          python -m unittest -v test_v166_e3_chat_decision_delivery
          python -m unittest -v test_v128_continuous_chat_atomic_parent