name: V174 fresh owner source -> frozen native V6 (synthetic tests only)
on:
  push:
    branches:
      - verify/ire-v6-v174-fresh-source-native-e4-20261119
      - verify/ire-v6-v175-fresh-native-host-batch-20261119
  pull_request:
    branches:
      - verify/ire-v6-v173-e4-only-final-gate-20261119
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - name: Install native evidence dependencies
        run: python -m pip install --disable-pip-version-check -r ire/requirements-evidence-ci.txt 'cryptography==46.0.4'
      - name: Native V6 source/atomic verification of source-first in-chat inputs
        working-directory: validation/ire-v6-frozen
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m unittest -v test_v174_fresh_to_native_v6
          python -m unittest -v test_v173_e4_only_parent
          python -m unittest -v test_v172_full_video_engine
      - name: Export frozen native V6 library for offline owner-source replay
        uses: actions/upload-artifact@v4
        with:
          name: v174-native-v6-source-only
          if-no-files-found: error
          retention-days: 1
          path: |
            ire/v6/*.py
            data/claims.jsonl
            ire/v5/advisory_knowledge/p4_integrated_scoped_education22_20261106.json
            ire/v5/advisory_knowledge/p4_p3_incremental_education29_20261106.json