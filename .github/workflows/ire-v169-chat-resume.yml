name: V169 E4 in-chat journal and native HOLD (synthetic; no advice)
on:
  push:
    branches:
      - verify/ire-v6-v169-chat-resumable-20261118
  pull_request:
    paths:
      - 'validation/ire-v6-frozen/v167_chat_research_loop.py'
      - 'validation/ire-v6-frozen/v169_chat_research_journal.py'
      - 'validation/ire-v6-frozen/test_v169_*.py'
      - '.github/workflows/ire-v169-chat-resume.yml'
permissions:
  contents: read
jobs:
  source-pinned-resume-and-native-hold:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - name: Install native V6 verification dependencies
        run: python -m pip install --disable-pip-version-check -r ire/requirements-evidence-ci.txt 'cryptography==46.0.4'
      - name: Compile and run V167, V168, V169 synthetic tests
        working-directory: validation/ire-v6-frozen
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m py_compile v167_chat_research_loop.py v168_chat_native_replay.py v169_chat_research_journal.py
          python -m unittest -v test_v167_chat_research_loop test_v168_chat_native_replay test_v169_chat_research_journal test_v169_native_interop