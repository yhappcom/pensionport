name: V171 source-bound semantic repair (synthetic only; no E4 release)
on:
  push:
    branches:
      - verify/ire-v6-v171-source-semantic-split-20261119
  pull_request:
    branches:
      - verify/ire-v6-v170-chat-boundary-revisit-20261119
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-frozen-v6-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - name: Install native evidence dependencies
        run: python -m pip install --disable-pip-version-check -r ire/requirements-evidence-ci.txt 'cryptography==46.0.4'
      - name: Verify original immutable V6 and V171 repaired atomic exchange
        working-directory: validation/ire-v6-frozen
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m unittest -v test_v171_source_bound_reatomization
          python -m unittest -v test_v170_native_in_chat_interop
          python -m unittest -v test_v170_evidence_revisit
          python -m unittest -v test_v169_native_interop