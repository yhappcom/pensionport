name: V173 E4-only native full-video approval (synthetic, no E5)
on:
  push:
    branches:
      - verify/ire-v6-v173-e4-only-final-gate-20261119
  pull_request:
    branches:
      - verify/ire-v6-v172-exhaustive-video-engine-20261119
  workflow_dispatch:
permissions:
  contents: read
jobs:
  e4-native-only:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - name: Install frozen native evidence dependencies
        run: python -m pip install --disable-pip-version-check -r ire/requirements-evidence-ci.txt 'cryptography==46.0.4'
      - name: Frozen V123 and E4-only parent/owner signature, no V126/V128 writes
        working-directory: validation/ire-v6-frozen
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m unittest -v test_v173_e4_only_parent
          python -m unittest -q test_v123_chat_final_gate
          python -m unittest -q test_v166_e4_primary_approval_gate
          python -m unittest -q test_v172_full_video_engine