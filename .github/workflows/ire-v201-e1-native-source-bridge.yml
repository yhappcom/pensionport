name: V201 E1 native source bridge and compatibility regression
on:
  push:
    branches:
      - verify/ire-v6-v201-e1-native-source-bridge-20261120
  pull_request:
    branches:
      - verify/ire-v6-v179-real-two-turn-source-firstpass-20261119
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-e1-source-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - name: Install frozen V6 test requirements
        run: python -m pip install --disable-pip-version-check -r ire/requirements-evidence-ci.txt 'cryptography==46.0.4'
      - name: Verify V201 E1 bridge and V176-V200 native regression
        working-directory: validation/ire-v6-frozen
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m compileall -q v176_chat_engine_loop.py v176_chat_engine_cli.py v178_coldstart_chat_packet_bridge.py v186_e3_qualifier_provenance.py v187_e3_parent_scope_bridge.py v187_e3_parent_scope_cli.py v188_e3_quality_gate.py v188_e3_quality_cli.py v189_e3_omission_repair_overlay.py v189_e3_parent_alignment_screen.py v189_e3_repair_cli.py v190_e3_parent_graph.py v190_e3_parent_cli.py v191_e3_parent_first.py v191_e3_parent_first_cli.py v192_e3_triplet_alignment.py v192_e3_triplet_cli.py v192_e3_frozen_reference.py v193_e3_two_user_turn_contract.py v194_e3_turn1_freeze.py v194_e3_turn1_freeze_cli.py v195_e3_second_user_turn_audit.py v196_e3_second_review_repair.py v197_e3_repaired_source_projection.py v197_e3_repaired_source_cli.py v198_e3_final_correction_adjudication.py v198_e3_final_review_cli.py v199_e3_residual_source_verdict.py v199_e3_residual_source_cli.py v200_e1_e5_live_gate.py v201_e1_native_source_bridge.py
          python -m unittest -v test_v179_noatom_risk_revisit test_v179_provisional_claim_projection
          python -m unittest -v test_v182_native_semantic_projection_gate
          python -m unittest -v test_v183_e3_two_turn_audit
          python -m unittest -v test_v184_e3_adjudication
          python -m unittest -v test_v185_e3_parent_qualifier_audit
          python -m unittest -v test_v186_e3_qualifier_provenance
          python -m unittest -v test_v187_e3_parent_scope_bridge
          python -m unittest -v test_v188_e3_quality_gate
          python -m unittest -v test_v189_e3_omission_repair_overlay test_v189_e3_parent_alignment_screen
          python -m unittest -v test_v190_e3_parent_graph
          python -m unittest -v test_v191_e3_parent_first
          python -m unittest -v test_v192_e3_triplet_alignment test_v192_e3_frozen_reference
          python -m unittest -v test_v193_e3_two_user_turn_contract test_v193_e3_protocol_docs
          python -m unittest -v test_v194_e3_turn1_freeze
          python -m unittest -v test_v195_e3_second_user_turn_audit
          python -m unittest -v test_v196_e3_second_review_repair
          python -m unittest -v test_v197_e3_repaired_source_projection
          python -m unittest -v test_v198_e3_final_correction_adjudication
          python -m unittest -v test_v199_e3_residual_source_verdict
          python -m unittest -v test_v178_coldstart_chat_packet_bridge test_v177_private_turn_checkpoint test_v176_chat_engine_loop
          python -m unittest -v test_v200_e1_e5_live_gate
          python -m unittest -v test_v201_e1_native_source_bridge
