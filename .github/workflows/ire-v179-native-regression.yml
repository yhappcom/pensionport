name: V191 E3 parent-first original source and claim typing regression (synthetic)
on:
  push:
    branches:
      - verify/ire-v6-v179-real-two-turn-source-firstpass-20261119
  pull_request:
    branches:
      - verify/ire-v6-v178-source-only-coldstart-20261119
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-source-and-noatom-resubmission:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - name: Install frozen V6 test requirements
        run: python -m pip install --disable-pip-version-check -r ire/requirements-evidence-ci.txt 'cryptography==46.0.4'
      - name: Verify V179 real issue regressions and V176-V178 compatibility
        working-directory: validation/ire-v6-frozen
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m compileall -q v176_chat_engine_loop.py v176_chat_engine_cli.py v178_coldstart_chat_packet_bridge.py v186_e3_qualifier_provenance.py v187_e3_parent_scope_bridge.py v187_e3_parent_scope_cli.py v188_e3_quality_gate.py v188_e3_quality_cli.py v189_e3_omission_repair_overlay.py v189_e3_parent_alignment_screen.py v189_e3_repair_cli.py v190_e3_parent_graph.py v190_e3_parent_cli.py v191_e3_parent_first.py v191_e3_parent_first_cli.py
          python -m unittest -v test_v179_noatom_risk_revisit test_v179_provisional_claim_projection
          python -m unittest -v test_v182_native_semantic_projection_gate
          python -m unittest -v test_v183_e3_two_turn_audit
          python -m unittest -v test_v184_e3_adjudication
          python -m unittest -v test_v185_e3_parent_qualifier_audit
          python -m unittest -v test_v186_e3_qualifier_provenance
          python -m unittest -v test_v187_e3_parent_scope_bridge
          python -m unittest -v test_v188_e3_quality_gate
          python -m unittest -v test_v189_e3_omission_repair_overlay test_v189_e3_parent_alignment_screen
          python -m unittest -v test_v190_e3_parent_graph
          python -m unittest -v test_v191_e3_parent_first
          python -m unittest -v test_v178_coldstart_chat_packet_bridge test_v177_private_turn_checkpoint test_v176_chat_engine_loop