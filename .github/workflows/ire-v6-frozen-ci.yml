name: IRE V6 frozen candidate - isolated P0A verification (NOT a release)
on:
  push:
    branches:
      - verify/ire-v6-frozen-ci-20261108
      - verify/ire-v6-p0-false-completion-20261109
      - verify/ire-v6-p0-integrity-hardening-20261109
      - verify/ire-v6-p0-sourcefrontier-20261109
      - verify/ire-v6-p0-atomic-exchange-20261109
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ire-v6-frozen-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  canonical-environment:
    name: Canonical 1214-file origin / CPython 3.11.18
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - name: Fail closed if HEAD, checkout, Python, or protected tree differs
        env:
          CANONICAL_BASE_SHA: f753ba57a1afabaa849f3eeca88170938c0b51f6
        run: |
          python - <<'PY'
          import json, os, pathlib, subprocess, sys
          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()
          base=os.environ["CANONICAL_BASE_SHA"]
          head=git("rev-parse","HEAD")
          subprocess.run(["git","merge-base","--is-ancestor",base,head],check=True)
          assert sys.version_info[:3]==(3,11,18), f"WRONG_PYTHON:{sys.version}"
          baseline=subprocess.check_output(
              ["git","ls-tree","-r","-z","--name-only",base])
          paths=[p.decode("utf-8") for p in baseline.split(b"\x00") if p]
          assert len(paths)==1214, f"TRACKED_COUNT_CHANGED:{len(paths)}"
          missing=[p for p in paths if not pathlib.Path(p).is_file()]
          assert not missing, f"INCOMPLETE_CHECKOUT:{missing[:5]}"
          diff=git("diff","--name-only",base,head).splitlines()
          allowed=lambda p:(p==".github/workflows/ire-v6-frozen-ci.yml" or
                            p.startswith("validation/ire-v6-frozen/") or
                            p.startswith("ire/v6/"))
          assert diff and all(map(allowed,diff)), f"PROTECTED_DIFF:{diff}"
          assert not git("status","--porcelain","--untracked-files=no"), "DIRTY_TRACKED_TREE"
          print("P0A_ENV_PASSED",json.dumps({
              "canonical_base":base,"candidate_sha":head,
              "original_tracked_files":len(paths),
              "python":sys.version.split()[0],
              "allowed_candidate_diff":diff
          },ensure_ascii=False,sort_keys=True))
          PY

  cross-version-six-gates:
    name: Six existing V5/IRE prepush gates in complete checkout
    needs: canonical-environment
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - name: Install exact current V5 / evidence dependencies
        run: |
          python -m pip install --disable-pip-version-check -r ire/requirements-evidence-ci.txt 'cryptography==46.0.4'
      - name: 1 - Compile full IRE tree
        run: python -m compileall -q ire
      - name: 2 - IRE baseline unit tests
        run: python -m unittest discover -s ire/tests -v
      - name: 3 - V5 core unit tests
        run: python -m unittest discover -s ire/v5/tests -p 'test_*.py' -v
      - name: 4 - V5 application unit tests
        run: python -m unittest discover -s ire/v5_app/tests -p 'test_*.py' -v
      - name: 5 - V5 preflight
        run: python -m ire.v5.preflight --root .
      - name: 6 - V5 one-turn
        run: python -m ire.v5.one_turn_run --root .

  frozen-v6-strict:
    name: Frozen V6 SHA+manifest and strict 8-gate test (must not fake GO)
    needs: canonical-environment
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - name: Install exact current V5 / evidence dependencies
        run: |
          python -m pip install --disable-pip-version-check -r ire/requirements-evidence-ci.txt 'cryptography==46.0.4'
      - name: Validate original V6 baseline and V2 official completion delta
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, subprocess
          p=pathlib.Path("validation/ire-v6-frozen/FROZEN_V6_CODE_MANIFEST.json")
          m=json.loads(p.read_text(encoding="utf-8"))
          assert m["source_manifest_sha256"]=="471000bbe99c9b7b27f2b00fcae46d01ad1c9110ecf66be38e99cb7d1b1fd340","HISTORICAL_MANIFEST_CHANGED"
          assert len(m["paths"])==25
          patch=json.loads(pathlib.Path("validation/ire-v6-frozen/V6_ATOMIC_HOST_EXCHANGE_PATCH_MANIFEST_V6.json").read_text(encoding="utf-8"))
          assert patch["schema"]=="IRE_V6_HOST_ATOMIC_EXCHANGE_PATCH_V6"
          assert patch["base_manifest_sha256"]==m["source_manifest_sha256"]
          assert patch['previous_v2_manifest_git_blob_sha']==subprocess.check_output(['git','hash-object','validation/ire-v6-frozen/V6_OFFICIAL_COMPLETION_PATCH_MANIFEST_V2.json'],text=True).strip(),'V2_HISTORICAL_MANIFEST_DRIFT'
          assert patch['previous_v3_manifest_git_blob_sha']==subprocess.check_output(['git','hash-object','validation/ire-v6-frozen/V6_OFFICIAL_RULE_AUDIT_PATCH_MANIFEST_V3.json'],text=True).strip(),'V3_HISTORICAL_MANIFEST_DRIFT'
          assert patch['previous_v4_manifest_git_blob_sha']==subprocess.check_output(['git','hash-object','validation/ire-v6-frozen/V6_OFFICIAL_RULE_STATUS_PATCH_MANIFEST_V4.json'],text=True).strip(),'V4_HISTORICAL_MANIFEST_DRIFT'
          assert patch["previous_v5_manifest_git_blob_sha"]==subprocess.check_output(["git","hash-object","validation/ire-v6-frozen/V6_SOURCE_FIRST_RESIDUAL_PATCH_MANIFEST_V5.json"],text=True).strip(),"HISTORICAL_V5_MANIFEST_DRIFT"
          assert patch["scope"]=="VALIDATION_BRANCH_ONLY" and patch["full_engine_p0_go"] is False
          changes={x["path"]:x["git_blob_sha"] for x in patch["modified_from_original"]}
          new={x["path"]:x["git_blob_sha"] for x in patch["added"]}
          assert set(changes)=={"ire/v6/store.py","ire/v6/state_machine.py"},"UNAUTHORIZED_MUTATED_CODE"
          assert set(new)=={"ire/v6/official_completion.py","ire/v6/tests/test_official_completion.py",
                           "ire/v6/claim_census.py","ire/v6/tests/test_claim_census.py",
                           "ire/v6/atomic_exchange.py","ire/v6/tests/test_atomic_exchange.py"},"UNAUTHORIZED_NEW_CODE"
          old={x["path"]:x for x in m["paths"]}
          assert set(changes).issubset(old) and not set(new).intersection(old)
          actual={f.as_posix() for f in pathlib.Path("ire/v6").rglob("*") if f.is_file()}
          assert actual==set(old)|set(new),"V6_FILE_CENSUS_DRIFT"
          assert len(actual)==patch["new_total_ire_v6_tracked_files"]==31
          for path,item in old.items():
              f=pathlib.Path(path)
              if path not in changes:
                  raw=f.read_bytes()
                  assert len(raw)==item["bytes"] and hashlib.sha256(raw).hexdigest()==item["sha256"],"ORIGINAL_FROZEN_SHA_DRIFT:"+path
          for path,sha in (changes|new).items():
              assert pathlib.Path(path).is_file()
              actual_sha=subprocess.check_output(["git","hash-object",path],text=True).strip()
              assert actual_sha==sha,"UNAUTHORIZED_V6_PATCH_BYTES:"+path
          print("HISTORICAL_BASE_PLUS_V6_HOST_ATOMIC_EXCHANGE_VERIFIED")
          PY
      - name: Strict frozen V6 and original 6 prepush gates on same exact commit
        run: python -m ire.v6.prepush --strict --root . --expected-sha "$GITHUB_SHA"

  official-primary-pinned-replay:
    name: Reverify archived first-party government body SHA (not fact approval)
    needs: canonical-environment
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - name: Verify negative controls for public document pins
        run: python -m unittest discover -s validation/ire-v6-frozen -p 'test_pinned_official_snapshot.py' -v
      - name: Verify permanently archived government HTML original bytes (no live net)
        run: python validation/ire-v6-frozen/verify_pinned_official_snapshot.py --directory validation/ire-v6-frozen/public_official_raw_20261108
      - name: Apply V2 official-source-only completion policy without human gold
        run: python -m unittest discover -s validation/ire-v6-frozen -p 'test_official_policy_v2.py' -v
      - name: Fail closed on actual private original high-risk tax case dispositions
        run: python -m unittest discover -s validation/ire-v6-frozen -p 'test_real_tax_claim_dispositions_v2.py' -v

  official-live-refetch-manual-only:
    name: Optional live government document refresh (NOT core CI)
    if: github.event_name == 'workflow_dispatch'
    needs: canonical-environment
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - name: First-party public source negative controls
        run: python -m unittest discover -s validation/ire-v6-frozen -p 'test_official_source_capture.py' -v
      - name: Refresh live originals and log current bytes
        run: python validation/ire-v6-frozen/official_source_capture.py --output "${{ runner.temp }}/ire-v6-new-public-original"
      - name: Preserve only public government bytes (not private SRT)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ire-v6-refreshed-official-${{ github.run_id }}
          path: ${{ runner.temp }}/ire-v6-new-public-original/
          if-no-files-found: warn
          retention-days: 90

  prospective-blind-cohort-precommitment:
    name: Preserve source cohort + V2 official source policy (no human reviewers)
    needs: canonical-environment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - name: Verify retained source scope under V2 official-source-only rules
        run: python -m unittest discover -s validation/ire-v6-frozen -p 'test_source_scope_v2.py' -v
      - name: Verify private real-source E2E attestation safe metadata against official and 116 protected files
        run: python -m unittest discover -s validation/ire-v6-frozen -p 'test_private_scope_bridge.py' -v




  canonical-116-hash-only-private-export:
    name: Reproduce protected 116 claim identity hashes for private original replay
    needs: canonical-environment
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - name: Export only immutable 116 claim identifiers and content hashes
        run: python validation/ire-v6-frozen/export_legacy_116_hashes.py --output "${{ runner.temp }}/ire-v6-legacy116/legacy116_hashes.json"
      - name: Upload private legacy membership hashes (no SRT / no claim text)
        uses: actions/upload-artifact@v4
        with:
          name: ire-v6-legacy116-hash-only-${{ github.run_id }}
          path: ${{ runner.temp }}/ire-v6-legacy116/legacy116_hashes.json
          if-no-files-found: error
          retention-days: 14
