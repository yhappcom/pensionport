          old={x["path"]:x for x in m["paths"]}
          assert set(changes).issubset(old) and not set(new).intersection(old)
          actual={f.as_posix() for f in pathlib.Path("ire/v6").rglob("*") if f.is_file()}
          # Additive V10 challenge docket. Historical V9 manifest and all its
