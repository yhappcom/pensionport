  official-primary-pinned-replay:
    name: Reverify archived first-party government body SHA (not fact approval)
    needs: canonical-environment
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - name: Verify negative controls for public document pins
        run: python -m unittest discover -s validation/ire-v6-frozen -p 'test_pinned_official_snapshot.py' -v
      - name: Verify permanently archived government HTML original bytes (no live net)
        run: python validation/ire-v6-frozen/verify_pinned_official_snapshot.py --directory validation/ire-v6-frozen/public_official_raw_20261108
      - name: Apply V2 official-source-only completion policy without human gold
        run: python -m unittest discover -s validation/ire-v6-frozen -p 'test_official_policy_v2.py' -v
      - name: Fail closed on actual private original high-risk tax case dispositions
        run: python -m unittest discover -s validation/ire-v6-frozen -p 'test_real_tax_claim_dispositions_v2.py' -v

  official-live-refetch-manual-only:
    name: Optional live government document refresh (NOT core CI)
    if: github.event_name == 'workflow_dispatch'
    needs: canonical-environment
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - name: First-party public source negative controls
        run: python -m unittest discover -s validation/ire-v6-frozen -p 'test_official_source_capture.py' -v
      - name: Refresh live originals and log current bytes
        run: python validation/ire-v6-frozen/official_source_capture.py --output "${{ runner.temp }}/ire-v6-new-public-original"
      - name: Preserve only public government bytes (not private SRT)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ire-v6-refreshed-official-${{ github.run_id }}
          path: ${{ runner.temp }}/ire-v6-new-public-original/
          if-no-files-found: warn
          retention-days: 90

  prospective-blind-cohort-precommitment:
    name: Preserve source cohort + V2 official source policy (no human reviewers)
    needs: canonical-environment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - name: Verify retained source scope under V2 official-source-only rules
        run: python -m unittest discover -s validation/ire-v6-frozen -p 'test_source_scope_v2.py' -v
      - name: Verify private real-source E2E attestation safe metadata against official and 116 protected files
        run: python -m unittest discover -s validation/ire-v6-frozen -p 'test_private_scope_bridge.py' -v
      - name: P0-3 nine-video prospective blind score arithmetic and no-fake-GO controls
        run: python -m unittest discover -s validation/ire-v6-frozen -p 'test_blind_cohort_gate.py' -v




  canonical-116-hash-only-private-export:
    name: Reproduce protected 116 claim identity hashes for private original replay
    needs: canonical-environment
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - name: Export only immutable 116 claim identifiers and content hashes
        run: python validation/ire-v6-frozen/export_legacy_116_hashes.py --output "${{ runner.temp }}/ire-v6-legacy116/legacy116_hashes.json"
      - name: Upload private legacy membership hashes (no SRT / no claim text)
        uses: actions/upload-artifact@v4
        with:
          name: ire-v6-legacy116-hash-only-${{ github.run_id }}
          path: ${{ runner.temp }}/ire-v6-legacy116/legacy116_hashes.json
          if-no-files-found: error
          retention-days: 14
