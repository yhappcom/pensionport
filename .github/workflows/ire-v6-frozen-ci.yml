name: IRE V6 frozen candidate - isolated P0A verification (NOT a release)
on:
  push:
    branches:
      - verify/ire-v6-frozen-ci-20261108
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ire-v6-frozen-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  canonical-environment:
    name: Canonical 1214-file origin / CPython 3.11.18
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - name: Fail closed if HEAD, checkout, Python, or protected tree differs
        env:
          CANONICAL_BASE_SHA: f753ba57a1afabaa849f3eeca88170938c0b51f6
        run: |
          python - <<'PY'
          import json, os, pathlib, subprocess, sys
          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()
          base=os.environ["CANONICAL_BASE_SHA"]
          head=git("rev-parse","HEAD")
          subprocess.run(["git","merge-base","--is-ancestor",base,head],check=True)
          assert sys.version_info[:3]==(3,11,18), f"WRONG_PYTHON:{sys.version}"
          baseline=subprocess.check_output(
              ["git","ls-tree","-r","-z","--name-only",base])
          paths=[p.decode("utf-8") for p in baseline.split(b"\x00") if p]
          assert len(paths)==1214, f"TRACKED_COUNT_CHANGED:{len(paths)}"
          missing=[p for p in paths if not pathlib.Path(p).is_file()]
          assert not missing, f"INCOMPLETE_CHECKOUT:{missing[:5]}"
          diff=git("diff","--name-only",base,head).splitlines()
          allowed=lambda p:(p==".github/workflows/ire-v6-frozen-ci.yml" or
                            p.startswith("validation/ire-v6-frozen/") or
                            p.startswith("ire/v6/"))
          assert diff and all(map(allowed,diff)), f"PROTECTED_DIFF:{diff}"
          assert not git("status","--porcelain","--untracked-files=no"), "DIRTY_TRACKED_TREE"
          print("P0A_ENV_PASSED",json.dumps({
              "canonical_base":base,"candidate_sha":head,
              "original_tracked_files":len(paths),
              "python":sys.version.split()[0],
              "allowed_candidate_diff":diff
          },ensure_ascii=False,sort_keys=True))
          PY

  cross-version-six-gates:
    name: Six existing V5/IRE prepush gates in complete checkout
    needs: canonical-environment
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - name: Install exact current V5 / evidence dependencies
        run: |
          python -m pip install --disable-pip-version-check -r ire/requirements-evidence-ci.txt 'cryptography==46.0.4'
      - name: 1 - Compile full IRE tree
        run: python -m compileall -q ire
      - name: 2 - IRE baseline unit tests
        run: python -m unittest discover -s ire/tests -v
      - name: 3 - V5 core unit tests
        run: python -m unittest discover -s ire/v5/tests -p 'test_*.py' -v
      - name: 4 - V5 application unit tests
        run: python -m unittest discover -s ire/v5_app/tests -p 'test_*.py' -v
      - name: 5 - V5 preflight
        run: python -m ire.v5.preflight --root .
      - name: 6 - V5 one-turn
        run: python -m ire.v5.one_turn_run --root .

  frozen-v6-strict:
    name: Frozen V6 SHA+manifest and strict 8-gate test (must not fake GO)
    needs: canonical-environment
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - name: Install exact current V5 / evidence dependencies
        run: |
          python -m pip install --disable-pip-version-check -r ire/requirements-evidence-ci.txt 'cryptography==46.0.4'
      - name: Require frozen 25 tracked files and authentic original manifest
        run: |
          python - <<'PY'
          import hashlib, json, pathlib
          p=pathlib.Path("validation/ire-v6-frozen/FROZEN_V6_CODE_MANIFEST.json")
          m=json.loads(p.read_text(encoding="utf-8"))
          assert m["source_manifest_sha256"]=="471000bbe99c9b7b27f2b00fcae46d01ad1c9110ecf66be38e99cb7d1b1fd340","MANIFEST_DIGEST_MISMATCH"
          items=m["paths"]
          assert len(items)==25 and len(set(v["path"] for v in items))==25,"FROZEN_COUNT_MISMATCH"
          actual={p.as_posix() for p in pathlib.Path("ire/v6").rglob("*") if p.is_file()}
          assert actual=={v["path"] for v in items},"UNREGISTERED_V6_FILE"
          for item in items:
              p=pathlib.Path(item["path"])
              assert not p.is_absolute() and ".." not in p.parts,"PATH_TRAVERSAL"
              raw=p.read_bytes()
              assert len(raw)==item["bytes"],"BAD_FROZEN_SIZE:"+item["path"]
              assert hashlib.sha256(raw).hexdigest()==item["sha256"],"BAD_FROZEN_SHA:"+item["path"]
          print("FROZEN_25_FILES_VERIFIED")
          PY
      - name: Strict frozen V6 and original 6 prepush gates on same exact commit
        run: python -m ire.v6.prepush --strict --root . --expected-sha "$GITHUB_SHA"

  official-primary-pinned-replay:
    name: Reverify public raw government source artifact SHA (not live or approved)
    needs: canonical-environment
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - name: Verify negative controls for public document pins
        run: python -m unittest discover -s validation/ire-v6-frozen -p 'test_pinned_official_snapshot.py' -v
      - name: Download originally verified official HTML from pinned prior GitHub Actions run
        uses: actions/download-artifact@v4
        with:
          name: ire-v6-public-official-42464865238
          run-id: 42464865238
          repository: yhappcom/pensionport
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/ire-v6-official-original
      - name: Verify exact original public HTML bytes and no independent fact approval
        run: python validation/ire-v6-frozen/verify_pinned_official_snapshot.py --directory "${{ runner.temp }}/ire-v6-official-original"

  official-live-refetch-manual-only:
    name: Optional live government document refresh (NOT core CI)
    if: github.event_name == 'workflow_dispatch'
    needs: canonical-environment
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - name: First-party public source negative controls
        run: python -m unittest discover -s validation/ire-v6-frozen -p 'test_official_source_capture.py' -v
      - name: Refresh live originals and log current bytes
        run: python validation/ire-v6-frozen/official_source_capture.py --output "${{ runner.temp }}/ire-v6-new-public-original"
      - name: Preserve only public government bytes (not private SRT)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ire-v6-refreshed-official-${{ github.run_id }}
          path: ${{ runner.temp }}/ire-v6-new-public-original/
          if-no-files-found: warn
          retention-days: 90

  prospective-blind-cohort-precommitment:
    name: Lock unseen-source protocol and thresholds (NOT human gold)
    needs: canonical-environment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - name: Verify immutable prospective blind pre-registration
        run: python -m unittest discover -s validation/ire-v6-frozen -p 'test_blind_preregistration.py' -v
