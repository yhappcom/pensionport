          assert len(m["paths"])==25
          patch=json.loads(pathlib.Path("validation/ire-v6-frozen/V6_HOST_BATCH_TRANSACTION_PATCH_MANIFEST_V9.json").read_text(encoding="utf-8"))
          assert patch["schema"]=="IRE_V6_HOST_BATCH_TRANSACTION_PATCH_V9"
          assert patch["base_manifest_sha256"]==m["source_manifest_sha256"]
          assert patch['previous_v2_manifest_git_blob_sha']==subprocess.check_output(['git','hash-object','validation/ire-v6-frozen/V6_OFFICIAL_COMPLETION_PATCH_MANIFEST_V2.json'],text=True).strip(),'V2_HISTORICAL_MANIFEST_DRIFT'
          assert patch['previous_v3_manifest_git_blob_sha']==subprocess.check_output(['git','hash-object','validation/ire-v6-frozen/V6_OFFICIAL_RULE_AUDIT_PATCH_MANIFEST_V3.json'],text=True).strip(),'V3_HISTORICAL_MANIFEST_DRIFT'
          assert patch['previous_v4_manifest_git_blob_sha']==subprocess.check_output(['git','hash-object','validation/ire-v6-frozen/V6_OFFICIAL_RULE_STATUS_PATCH_MANIFEST_V4.json'],text=True).strip(),'V4_HISTORICAL_MANIFEST_DRIFT'
          assert patch["previous_v5_manifest_git_blob_sha"]==subprocess.check_output(["git","hash-object","validation/ire-v6-frozen/V6_SOURCE_FIRST_RESIDUAL_PATCH_MANIFEST_V5.json"],text=True).strip(),"HISTORICAL_V5_MANIFEST_DRIFT"
          assert patch["previous_v6_manifest_git_blob_sha"]==subprocess.check_output(["git","hash-object","validation/ire-v6-frozen/V6_ATOMIC_HOST_EXCHANGE_PATCH_MANIFEST_V6.json"],text=True).strip(),"HISTORICAL_V6_MANIFEST_DRIFT"
          assert patch["previous_v7_manifest_git_blob_sha"]==subprocess.check_output(["git","hash-object","validation/ire-v6-frozen/V6_LEGACY_V2_ARCHIVE_PATCH_MANIFEST_V7.json"],text=True).strip(),"HISTORICAL_V7_MANIFEST_DRIFT"
