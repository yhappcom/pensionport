name: V3.0 integrated research architecture and provenance gate

on:
  push:
    branches:
      - feat/v30-integrated-research-engine-20261031
    paths:
      - "v30/**"
      - "scripts/v30_integrated_research.py"
      - "scripts/verify_v30_integrated_research.py"
      - "scripts/audit_v30_deep_readonly.py"
      - "scripts/v30_verified_core.py"
      - "scripts/v30_evidence_services.py"
      - "scripts/v30_hybrid_search.py"
      - "scripts/v30_research_pipeline.py"
      - "scripts/v30_v5_bridge.py"
      - "scripts/verify_v30_full_research.py"
      - "scripts/verify_v30_repository_safety.py"
      - ".github/workflows/v30-integrated-research-gate.yml"
  pull_request:
    paths:
      - "v30/**"
      - "scripts/v30_integrated_research.py"
      - "scripts/verify_v30_integrated_research.py"
      - "scripts/audit_v30_deep_readonly.py"
      - "scripts/v30_verified_core.py"
      - "scripts/v30_evidence_services.py"
      - "scripts/v30_hybrid_search.py"
      - "scripts/v30_research_pipeline.py"
      - "scripts/v30_v5_bridge.py"
      - "scripts/verify_v30_full_research.py"
      - "scripts/verify_v30_repository_safety.py"
      - ".github/workflows/v30-integrated-research-gate.yml"

permissions:
  contents: read

jobs:
  design-and-research-provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compile V3.0 source and adversarial test suite
        run: |
          python -m py_compile scripts/v30_integrated_research.py scripts/verify_v30_integrated_research.py
      - name: Verify all 4120 historic claims and 39 families without any source rewrite
        run: |
          python -B scripts/v30_integrated_research.py --root . --validate-baseline
      - name: Test structured finance roles, source identity, synthetic numeric models, all safety gates
        run: |
          python -B scripts/verify_v30_integrated_research.py --root .
      - name: Replay existing video 019 as source-locked BLOCKED worklist, not a completed new research
        run: |
          python -B scripts/v30_integrated_research.py --root . --plan-development-video 19
      - name: Replay existing video 020 as source-locked BLOCKED worklist, not a completed new research
        run: |
          python -B scripts/v30_integrated_research.py --root . --plan-development-video 20
      - name: Red-team reproducibility audit of V3.0 bootstrap limitations (no engine changes)
        run: |
          python -m py_compile scripts/audit_v30_deep_readonly.py
          python -B scripts/audit_v30_deep_readonly.py --root .
      - name: Recheck frozen V3.0 security audit evidence against exact source blobs
        run: |
          python -B scripts/audit_v30_deep_readonly.py --root . > /tmp/v30_audit_replayed.json
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          snap=json.loads(Path("v30/audits/v30_deep_findings_v1.json").read_text(encoding="utf-8"))
          actual=json.loads(Path("/tmp/v30_audit_replayed.json").read_text(encoding="utf-8"))
          def git_blob_sha(path):
              b=Path(path).read_bytes()
              return hashlib.sha1(b"blob " + str(len(b)).encode() + b"\0" + b).hexdigest()
          assert snap["schema"]=="V30_ENGINE_READ_ONLY_DEEP_AUDIT_SNAPSHOT_V1"
          assert snap["audit_runner_git_blob_sha"]==git_blob_sha("scripts/audit_v30_deep_readonly.py")
          assert snap["audited_engine_git_blob_sha"]==git_blob_sha("scripts/v30_integrated_research.py")
          assert snap["proof"]==actual
          assert snap["issue_counts"]=={"P0_architectural":3,"P1_high":7,"total":10}
          assert snap["release_decision"].startswith("BLOCKED_")
          print("PASS: 10 original audit weaknesses reproduced without source modifications")
          PY
      - name: V3.0 complete eight-stage offline pipeline, source/authenticity and V5 bridge adversarial suite
        run: |
          python -m py_compile scripts/v30_verified_core.py scripts/v30_evidence_services.py scripts/v30_hybrid_search.py scripts/v30_research_pipeline.py scripts/verify_v30_full_research.py scripts/v30_v5_bridge.py
          python -B scripts/verify_v30_full_research.py
      - name: V3.0 production CLI preflight remains evidence BLOCKED
        run: |
          python -B scripts/v30_research_pipeline.py --root .
      - name: Preserve existing research completion policy and empirical fact gates
        run: |
          python -B scripts/verify_v5_research_completion.py --root . --self-test
      - name: Verify all changed files against immutable research baseline and scan public privacy leaks
        run: |
          python -m py_compile scripts/verify_v30_repository_safety.py
          python -B scripts/verify_v30_repository_safety.py
      - name: No private original SRT, account data or binary datasets in V3.0
        shell: bash
        run: |
          if git ls-files -- 'v30/**' | grep -Ei '\.(csv|xlsx|xls|zip|srt|pdf|sqlite|db|pem|p12|env)$'; then
            echo 'ERROR: forbidden file type'; exit 1
          fi
          if git ls-files -- 'v30/private/**' 'v30/accounts/**' 'v30/actual/**'; then
            if git ls-files -- 'v30/private/**' 'v30/accounts/**' 'v30/actual/**' | grep -q .; then
              echo 'ERROR: private file in V3.0'; exit 1
            fi
          fi
          echo 'PASS: V3.0 artifacts are nonpersonal source/contracts only'
