name: V3.0 integrated research architecture and provenance gate

on:
  push:
    branches:
      - feat/v30-integrated-research-engine-20261031
    paths:
      - "v30/**"
      - "scripts/v30_integrated_research.py"
      - "scripts/verify_v30_integrated_research.py"
      - "scripts/audit_v30_deep_readonly.py"
      - "scripts/v30_verified_core.py"
      - "scripts/v30_evidence_services.py"
      - "scripts/v30_hybrid_search.py"
      - "scripts/v30_claim_extraction.py"
      - "scripts/v30_research_pipeline.py"
      - "scripts/v30_state_machine.py"
      - "scripts/v30_independent_evaluator.py"
      - "scripts/v30_semantic_v31.py"
      - "scripts/v30_finance_math_v31.py"
      - "scripts/verify_v30_v31_development.py"
      - "scripts/verify_v30_v31_firstuse.py"
      - "scripts/verify_v30_v31_realcohort.py"
      - "scripts/v30_semantic_v32.py"
      - "scripts/v30_semantic_frame_v33.py"
      - "scripts/v30_blind_recall_v33.py"
      - "scripts/verify_v30_v33_blind.py"
      - "scripts/verify_v30_v33_intake.py"
      - "scripts/v30_semantic_extraction_v33.py"
      - "scripts/verify_v30_v33_semantics.py"
      - "scripts/verify_v30_v32_development.py"
      - "scripts/v30_legacy_verdict_v32.py"
      - "scripts/verify_v30_v32_firstuse.py"
      - "scripts/v30_v5_bridge.py"
      - "scripts/verify_v30_full_research.py"
      - "scripts/verify_v30_001_005_replay.py"
      - "scripts/verify_v30_private_srt_001_005.py"
      - "scripts/verify_v30_repository_safety.py"
      - ".github/workflows/v30-integrated-research-gate.yml"
  pull_request:
    paths:
      - "v30/**"
      - "scripts/v30_integrated_research.py"
      - "scripts/verify_v30_integrated_research.py"
      - "scripts/audit_v30_deep_readonly.py"
      - "scripts/v30_verified_core.py"
      - "scripts/v30_evidence_services.py"
      - "scripts/v30_hybrid_search.py"
      - "scripts/v30_claim_extraction.py"
      - "scripts/v30_research_pipeline.py"
      - "scripts/v30_state_machine.py"
      - "scripts/v30_independent_evaluator.py"
      - "scripts/v30_semantic_v31.py"
      - "scripts/v30_finance_math_v31.py"
      - "scripts/verify_v30_v31_development.py"
      - "scripts/verify_v30_v31_firstuse.py"
      - "scripts/verify_v30_v31_realcohort.py"
      - "scripts/v30_semantic_v32.py"
      - "scripts/v30_semantic_frame_v33.py"
      - "scripts/v30_blind_recall_v33.py"
      - "scripts/verify_v30_v33_blind.py"
      - "scripts/verify_v30_v33_intake.py"
      - "scripts/v30_semantic_extraction_v33.py"
      - "scripts/verify_v30_v33_semantics.py"
      - "scripts/verify_v30_v32_development.py"
      - "scripts/v30_legacy_verdict_v32.py"
      - "scripts/verify_v30_v32_firstuse.py"
      - "scripts/v30_v5_bridge.py"
      - "scripts/verify_v30_full_research.py"
      - "scripts/verify_v30_001_005_replay.py"
      - "scripts/verify_v30_private_srt_001_005.py"
      - "scripts/verify_v30_repository_safety.py"
      - ".github/workflows/v30-integrated-research-gate.yml"

permissions:
  contents: read

jobs:
  design-and-research-provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compile V3.0 source and adversarial test suite
        run: |
          python -m py_compile scripts/v30_integrated_research.py scripts/verify_v30_integrated_research.py
      - name: Verify all 4120 historic claims and 39 families without any source rewrite
        run: |
          python -B scripts/v30_integrated_research.py --root . --validate-baseline
      - name: Test structured finance roles, source identity, synthetic numeric models, all safety gates
        run: |
          python -B scripts/verify_v30_integrated_research.py --root .
      - name: Replay existing video 019 as source-locked BLOCKED worklist, not a completed new research
        run: |
          python -B scripts/v30_integrated_research.py --root . --plan-development-video 19
      - name: Replay existing video 020 as source-locked BLOCKED worklist, not a completed new research
        run: |
          python -B scripts/v30_integrated_research.py --root . --plan-development-video 20
      - name: Red-team reproducibility audit of V3.0 bootstrap limitations (no engine changes)
        run: |
          python -m py_compile scripts/audit_v30_deep_readonly.py
          python -B scripts/audit_v30_deep_readonly.py --root .
      - name: Recheck frozen V3.0 security audit evidence against exact source blobs
        run: |
          python -B scripts/audit_v30_deep_readonly.py --root . > /tmp/v30_audit_replayed.json
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          snap=json.loads(Path("v30/audits/v30_deep_findings_v1.json").read_text(encoding="utf-8"))
          actual=json.loads(Path("/tmp/v30_audit_replayed.json").read_text(encoding="utf-8"))
          def git_blob_sha(path):
              b=Path(path).read_bytes()
              return hashlib.sha1(b"blob " + str(len(b)).encode() + b"\0" + b).hexdigest()
          assert snap["schema"]=="V30_ENGINE_READ_ONLY_DEEP_AUDIT_SNAPSHOT_V1"
          assert snap["audit_runner_git_blob_sha"]==git_blob_sha("scripts/audit_v30_deep_readonly.py")
          assert snap["audited_engine_git_blob_sha"]==git_blob_sha("scripts/v30_integrated_research.py")
          assert snap["proof"]==actual
          assert snap["issue_counts"]=={"P0_architectural":3,"P1_high":7,"total":10}
          assert snap["release_decision"].startswith("BLOCKED_")
          print("PASS: 10 original audit weaknesses reproduced without source modifications")
          PY
      - name: V3.0 complete eight-stage offline pipeline, source/authenticity and V5 bridge adversarial suite
        run: |
          python -m py_compile scripts/v30_verified_core.py scripts/v30_evidence_services.py scripts/v30_hybrid_search.py scripts/v30_research_pipeline.py scripts/verify_v30_full_research.py scripts/v30_v5_bridge.py scripts/v30_claim_extraction.py scripts/v30_state_machine.py scripts/v30_independent_evaluator.py
          python -B scripts/verify_v30_full_research.py
      - name: Replay unchanged V3.0 and V2.3 retrieval on 1-5 historical core claims
        run: |
          python -m py_compile scripts/verify_v30_001_005_replay.py scripts/verify_v30_private_srt_001_005.py
          python -B scripts/verify_v30_001_005_replay.py --root . --assert-snapshot
      - name: V3.1 finance scope + effective-rate development-only comparisons
        run: |
          python -m py_compile scripts/v30_semantic_v31.py scripts/v30_finance_math_v31.py scripts/verify_v30_v31_development.py
          python -B scripts/verify_v30_v31_development.py --root .
      - name: V3.1 protected post-freeze 48-case novel synthetic first-use
        run: |
          python -m py_compile scripts/verify_v30_v31_firstuse.py
          python -B scripts/verify_v30_v31_firstuse.py --root . --assert-snapshot
      - name: V3.1 #61-65 separate real historical-cohort relation first use
        run: |
          python -m py_compile scripts/verify_v30_v31_realcohort.py
          python -B scripts/verify_v30_v31_realcohort.py --root . --assert-snapshot
      - name: V3.2 general financial taxonomy regression on two development cohorts
        run: |
          python -m py_compile scripts/v30_semantic_v32.py scripts/verify_v30_v32_development.py
          python -B scripts/verify_v30_v32_development.py --root . --assert-snapshot
      - name: V3.2 first use on #66-70 source-pinned 108 actual historical claims
        run: |
          python -m py_compile scripts/v30_legacy_verdict_v32.py scripts/verify_v30_v32_firstuse.py
          python -B scripts/verify_v30_v32_firstuse.py --root . --assert-snapshot
      - name: V3.3 independent source-bound semantic validation adversarial tests
        run: |
          python -m py_compile scripts/v30_semantic_frame_v33.py scripts/v30_semantic_extraction_v33.py scripts/verify_v30_v33_semantics.py
          python -B scripts/verify_v30_v33_semantics.py
      - name: V3.3 blinded dual-review gold and comprehensive no-leak recall gate
        run: |
          python -m py_compile scripts/v30_blind_recall_v33.py scripts/verify_v30_v33_blind.py
          python -B scripts/verify_v30_v33_blind.py
      - name: V3.3 real unseen source intake and nonfabricated performance metric gate
        run: |
          python -m py_compile scripts/verify_v30_v33_intake.py
          python -B scripts/verify_v30_v33_intake.py --assert-snapshot
      - name: V3.0 production CLI preflight remains evidence BLOCKED
        run: |
          python -B scripts/v30_research_pipeline.py --root .
      - name: Preserve existing research completion policy and empirical fact gates
        run: |
          python -B scripts/verify_v5_research_completion.py --root . --self-test
      - name: Freeze all twelve V3.0 code and policy blobs with zero automatic release
        run: |
          python - <<'PY'
          import json
          import hashlib
          from pathlib import Path
          p=Path("v30/contracts/v30_development_freeze_20261031_v1.json")
          j=json.loads(p.read_text(encoding="utf-8"))
          assert j["schema"]=="V30_ENGINE_IMPLEMENTATION_DEVELOPMENT_FREEZE_V1"
          assert j["release"].startswith("BLOCKED_")
          assert len(j["module_git_blobs"])==12
          for relative,sha in j["module_git_blobs"].items():
              raw=Path(relative).read_bytes()
              blob=hashlib.sha1(
                  b"blob "+str(len(raw)).encode()+b"\0"+raw).hexdigest()
              assert sha==blob, f"frozen implementation drift: {relative}"
          g=j["development_gate"]
          assert g["adversarial_scenarios_pass"]==47
          assert g["real_research_complete_certificates"]==0
          assert g["automatic_knowledge_merges"]==0
          assert g["unseen_video_21_plus_used"]==0
          print("PASS: 12 frozen V3.0 files, 47 development tests, zero automatic approvals")
          PY
      - name: Enforce immutable V3.1/V3.2 first-use failure and BLOCKED release
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          gate=json.loads(Path("v30/contracts/v32_release_gate_after_66_70_v1.json").read_text())
          assert gate["schema"]=="V32_RELEASE_BLOCKED_AFTER_SEPARATE_REAL_FIRST_USE_V1"
          assert gate["status"]=="RESEARCH_BLOCKED_PRODUCTION_BLOCKED" and not gate["criteria_met"]
          assert not gate["release_criteria"]["independent_blind_gold_required"] is False
          assert gate["research_complete_certificates_generated"]==0
          assert gate["knowledge_auto_merge_approvals"]==0 and gate["personal_trade_orders"]==0
          paths={
            "semantic_v31":"scripts/v30_semantic_v31.py",
            "math_v31":"scripts/v30_finance_math_v31.py",
            "semantic_v32":"scripts/v30_semantic_v32.py",
            "verdict_compat_v32":"scripts/v30_legacy_verdict_v32.py"
          }
          def blob(path):
              b=Path(path).read_bytes()
              return hashlib.sha1(b"blob "+str(len(b)).encode()+b"\0"+b).hexdigest()
          for key,path in paths.items():
              assert gate["exact_frozen_code_git_blobs"][key]==blob(path),path
          first=json.loads(Path("v30/validation/v31_061_065_realcohort_result_v1.json").read_text())
          second=json.loads(Path("v30/validation/v32_066_070_real_firstuse_result_v1.json").read_text())
          assert gate["v31_real_first_use"]["result_git_blob"]==blob("v30/validation/v31_061_065_realcohort_result_v1.json")
          assert gate["v32_real_first_use"]["result_git_blob"]==blob("v30/validation/v32_066_070_real_firstuse_result_v1.json")
          assert first["direct_typed_relation_diagnostic"]["counts"]=={"TP":8,"FN":16,"FP":0,"TN":24}
          assert second["typed_top10_either_direction_diagnostic"]["counts"]=={"TP":5,"FN":19,"FP":0,"TN":24}
          assert gate["v32_real_first_use"]["top10"]["recall"]==5/24
          assert not first["independent_blinded_human_labeling"]
          assert second["source_and_gold_not_annotated_by_external_independent_human"]
          print("PASS V3.1/V3.2 frozen source and failure snapshots; production BLOCKED")
          PY
      - name: Freeze exact V3.3 audited semantic and blind protocol sources and pending outcome
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path(".")
          j=json.loads((root/"v30/contracts/v33_semantic_blind_freeze_20261031_v1.json").read_text())
          assert j["schema"]=="V33_INDEPENDENT_SEMANTIC_FRAME_AND_REAL_UNSEEN_BLIND_FREEZE_V1"
          assert j["release"]=="BLOCKED_MISSING_REAL_ORIGINAL_SRT_AND_EXTERNAL_BLIND_GOLD"
          assert j["test_execution"]["actual_unseen_recall"] is None
          assert j["test_execution"]["actual_unseen_precision"] is None
          assert j["test_execution"]["original_261_264_SRT_bytes_available"]==0
          assert j["test_execution"]["independently_signed_real_gold_sets"]==0
          assert j["test_execution"]["automatic_knowledge_merges"]==0
          def blob(path):
              raw=path.read_bytes()
              return hashlib.sha1(
                  b"blob "+str(len(raw)).encode()+b"\0"+raw).hexdigest()
          for relative,sha in sorted(j["frozen_git_blobs"].items()):
              assert blob(root/relative)==sha, "V33_SENSITIVE_CODE_CHANGED_"+relative
          assert blob(root/"v30/holdout/v33_261_264_unseen_intake_v1.json")==j["unseen_intake_blob_sha"]
          state=json.loads((root/"v30/holdout/v33_pre_eval_snapshot_v1.json").read_text())
          assert state["actual_recall"] is None and state["actual_precision"] is None
          assert state["preconditions"]["release_status"]=="BLOCKED_NO_AUTHENTICATED_REAL_UNSEEN_GOLD"
          print("PASS: V3.3 frozen provenance+review+blind code, actual unseen score NULL, release BLOCKED")
          PY
      - name: Verify all changed files against immutable research baseline and scan public privacy leaks
        run: |
          python -m py_compile scripts/verify_v30_repository_safety.py
          python -B scripts/verify_v30_repository_safety.py
      - name: No private original SRT, account data or binary datasets in V3.0
        shell: bash
        run: |
          if git ls-files -- 'v30/**' | grep -Ei '\.(csv|xlsx|xls|zip|srt|pdf|sqlite|db|pem|p12|env)$'; then
            echo 'ERROR: forbidden file type'; exit 1
          fi
          if git ls-files -- 'v30/private/**' 'v30/accounts/**' 'v30/actual/**'; then
            if git ls-files -- 'v30/private/**' 'v30/accounts/**' 'v30/actual/**' | grep -q .; then
              echo 'ERROR: private file in V3.0'; exit 1
            fi
          fi
          echo 'PASS: V3.0 artifacts are nonpersonal source/contracts only'

      - name: Package public code and existing research metadata for offline original-SRT replay
        if: github.event_name == 'push'
        run: |
          tar -czf "${RUNNER_TEMP}/v30-public-replay-sources.tar.gz" \
            scripts/*.py v30 \
            v5/*.json v5/policy v5/integration v5/retrofit \
            data/analysis_events data/subtitles/content_index_001_070.json \
            data/synthesis/investment_knowledge_001_260
          test -s "${RUNNER_TEMP}/v30-public-replay-sources.tar.gz"
      - name: Archive public replay bundle without private SRT originals
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: v30-public-code-offline-replay
          path: ${{ runner.temp }}/v30-public-replay-sources.tar.gz
          retention-days: 2
          if-no-files-found: error
