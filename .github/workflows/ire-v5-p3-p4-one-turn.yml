name: IRE V5 P3 P4 one-turn integration gate

on:
  pull_request:
    paths:
      - 'ire/v5/**'
      - '.github/workflows/ire-v5-p3-p4-one-turn.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ire-v5-p3-p4-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  one-turn-p3-p4:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned signature verifier dependency
        run: python -m pip install --disable-pip-version-check 'cryptography==46.0.4'
      - name: Regression-test provisional source ownership and adversarial cue cases
        run: python -m unittest discover -s tests -p 'test_v5_p0_claim_ownership.py' -v
      - name: Verify full V5 one-turn pipeline and emit bounded research receipt
        run: python -m ire.v5.one_turn_run --root .
      - name: Verify active P4 22-node graph and 27 P3 quarantined windows
        run: python -m ire.v5.p4_active_integration --root .
